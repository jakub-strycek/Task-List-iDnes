:root{
  /* iMEDIATIC */
  --magenta:#FF1A6B; --magenta-glow:#FF3D85; --magenta-deep:#C70054;
  --cream:#F5EBD6; --paper:#FAFAF8; --ink:#0E0E10; --ink-2:#131316; --ink-3:#1C1C20;
  --g900:#1A1A1D; --g700:#3A3A3F; --g500:#8A8A90; --g300:#D8D8DC;
  --line:#E7E3DA; --line2:#F0ECE4; --soft:#F7F3EA;
  --r:10px; --sh:0 1px 2px rgba(14,14,16,.04), 0 8px 24px rgba(14,14,16,.06);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font:14.5px/1.55 'Inter',-apple-system,'Helvetica Neue',Arial,sans-serif;
  font-feature-settings:'cv05','ss01';-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--magenta);outline-offset:2px;border-radius:4px}
::selection{background:var(--magenta);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--g300);border-radius:6px;border:3px solid var(--paper)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- značka ---------- */
.mark{display:flex;align-items:center;gap:11px;flex:0 0 auto}
.glyph{position:relative;width:8px;height:32px;background:var(--cream);border-radius:1px}
.glyph i{position:absolute;left:50%;top:19%;transform:translateX(-50%);width:2px;height:62%;
  background:var(--magenta);box-shadow:0 0 8px rgba(255,26,107,.75)}
.wordmark{font-size:11px;font-weight:600;letter-spacing:.22em;color:var(--cream)}

/* ---------- horní pás ---------- */
.band{flex:0 0 auto;background:var(--ink);color:var(--cream);padding:13px 22px;display:flex;align-items:center;gap:22px}
.band .proj{flex:1;min-width:0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.band h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.015em;color:#fff}
.band .sep{width:1px;height:14px;background:rgba(245,235,214,.28)}
.band .cil{font-size:12.5px;color:rgba(245,235,214,.72)}
.band .meta{font-size:11.5px;color:rgba(245,235,214,.55);text-align:right;line-height:1.45;white-space:nowrap}

/* ---------- lišta nástrojů ---------- */
.tools{flex:0 0 auto;background:#fff;border-bottom:1px solid var(--line);padding:10px 22px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:flex;background:var(--soft);border-radius:9px;padding:3px;gap:2px}
.seg button{padding:7px 14px;font-size:13.5px;font-weight:500;color:var(--g700);border-radius:7px;transition:.15s var(--ease)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--cream);font-weight:600}
.search{flex:1;min-width:190px;max-width:420px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:9px;background:#fff}
.search input::placeholder{color:var(--g500)}
.search input:focus{outline:none;border-color:var(--magenta);box-shadow:0 0 0 3px rgba(255,26,107,.12)}
.search svg{position:absolute;left:11px;top:10px;color:var(--g500)}
.btn{padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:600;
  font-size:13.5px;white-space:nowrap;transition:.15s var(--ease)}
.btn:hover{border-color:var(--g500)}
.btn.pri{background:var(--magenta);color:#fff;border-color:var(--magenta)}
.btn.pri:hover{background:var(--magenta-glow);box-shadow:0 10px 30px rgba(255,26,107,.28);transform:translateY(-1px)}
.btn.sm{padding:5px 10px;font-size:12.5px;font-weight:500}
.btn.ink{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:44px;background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--sh);padding:7px;min-width:250px;z-index:40;display:none}
.menu.on{display:block}
.menu button{display:block;width:100%;text-align:left;padding:9px 11px;border-radius:8px;font-size:13.5px}
.menu button:hover{background:var(--soft)}
.menu hr{border:0;border-top:1px solid var(--line2);margin:6px 3px}
.menu .note{padding:7px 11px;font-size:11.5px;color:var(--g500);line-height:1.45}
.stav-ulozeno{margin-left:auto;font-size:12px;color:var(--g500);white-space:nowrap}

/* ---------- signální pruh ---------- */
.sig{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--line2)}
.sig i{display:block;height:100%}
.sig .h{background:var(--ink)}
.sig .p{background:var(--magenta)}
.sig .n{background:var(--g300)}
.sig.mini{height:3px}

/* ---------- rozvržení ---------- */
.layout{flex:1;display:flex;min-height:0}
.side{flex:0 0 252px;border-right:1px solid var(--line);overflow:auto;padding:16px 12px 40px;background:#fff}
.side h4{margin:18px 9px 8px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--magenta);font-weight:600}
.side h4:first-child{margin-top:2px}
.it{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:9px;color:var(--g700);
  font-size:13.5px;line-height:1.3;transition:.12s var(--ease)}
.it:hover{background:var(--soft)}
.it.on{background:var(--ink);color:var(--cream)}
.it .r1{display:flex;align-items:center;gap:8px}
.it .nm{flex:1;min-width:0}
.it .cnt{font-size:11.5px;color:var(--g500);font-variant-numeric:tabular-nums}
.it.on .cnt{color:rgba(245,235,214,.65)}
.it .sig{margin-top:6px}
.it.on .sig{background:rgba(245,235,214,.22)}
.it.on .sig .h{background:var(--cream)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 9px}
.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--g700);transition:.12s var(--ease)}
.chip:hover{border-color:var(--g500)}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--cream);font-weight:600}
.side select{width:calc(100% - 18px);margin:2px 9px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:13px}

main{flex:1;overflow:auto;padding:22px 26px 90px}
.wrap{max-width:1180px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--magenta);margin-bottom:6px}
.mhead{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.mhead h2{font-size:26px;margin:0;letter-spacing:-.025em;line-height:1.08;font-weight:600}
.mhead p{margin:5px 0 0;font-size:13.5px;color:var(--g700);max-width:70ch}
.mhead .cnt{margin-left:auto;font-size:12.5px;color:var(--g500);white-space:nowrap}

/* ---------- přehled ---------- */
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px}
.kpi .big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.kpi .big b{font-size:54px;font-weight:400;letter-spacing:-.045em;line-height:.95}
.kpi .big span{font-size:14px;color:var(--g700)}
.kpi .sig{margin:16px 0 10px}
.leg{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--g700)}
.leg span{display:inline-flex;align-items:center;gap:7px}
.leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;transition:.18s var(--ease)}
.card:hover{border-color:var(--g300);box-shadow:var(--sh)}
.card h3{margin:0 0 3px;font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.card .hint{font-size:12px;color:var(--g500);margin-bottom:12px}
.card ul{list-style:none;margin:0;padding:0}
.card li{padding:9px 0;border-top:1px solid var(--line2);cursor:pointer}
.card li:first-child{border-top:0;padding-top:2px}
.card li:hover .t{color:var(--magenta-deep)}
.card li .t{font-size:13.5px;font-weight:500;line-height:1.35;display:block}
.card li .m{font-size:12px;color:var(--g500);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.card li .m b{color:var(--ink);font-weight:600}
.card li .m b.late{color:var(--magenta-deep)}
.card .none{font-size:13px;color:var(--g500);padding:6px 0}
.card .none{font-size:13px;color:var(--g500);padding:6px 0}
.mini-areas{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.marea{display:grid;grid-template-columns:1fr 132px 74px;gap:14px;align-items:center;padding:9px 0;border-top:1px solid var(--line2);cursor:pointer}
.marea:first-of-type{border-top:0}
.marea:hover .nm{color:var(--magenta-deep)}
.marea .nm{font-size:13.5px;font-weight:500}
.marea .cnt{font-size:12px;color:var(--g500);text-align:right;font-variant-numeric:tabular-nums}
.gaps{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.gap{flex:1;min-width:150px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left}
.gap b{display:block;font-size:26px;font-weight:400;letter-spacing:-.035em;line-height:1.1}
.gap span{font-size:12.5px;color:var(--g700)}
.gap:hover{border-color:var(--magenta);background:#fff}

/* ---------- seznam ---------- */
.sec{margin:26px 0 9px;display:flex;align-items:baseline;gap:11px;cursor:pointer;user-select:none}
.sec:first-child{margin-top:4px}
.sec h3{font-size:16px;margin:0;letter-spacing:-.015em;font-weight:700}
.sec .d{font-size:12.5px;color:var(--g500);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec .tw{font-size:10px;color:var(--g500);transition:transform .15s var(--ease)}
.sec.closed .tw{transform:rotate(-90deg)}
.sec .sig{width:96px;flex:0 0 auto}
.row{display:flex;gap:13px;align-items:flex-start;background:#fff;border:1px solid var(--line);
  border-radius:var(--r);padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:.14s var(--ease)}
.row:hover{border-color:var(--g300);box-shadow:var(--sh);transform:translateY(-1px)}
.row.done{background:#fdfcfa}
.row.done .t{color:var(--g500)}
.row .body{flex:1;min-width:0}
.row .t{font-size:14.5px;font-weight:600;line-height:1.35;letter-spacing:-.005em}
.row .p{margin:4px 0 0;font-size:13px;color:var(--g700);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .jak{margin:6px 0 0;font-size:12.5px;color:var(--g700);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .jak b{font-weight:600;color:var(--ink)}
.row .soucast{margin:5px 0 0;font-size:12px;color:var(--g500);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .soucast b{font-weight:600;color:var(--g700)}
.row .m{margin-top:8px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;font-size:12px;color:var(--g500)}
.tag{padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--g700);white-space:nowrap}
.tag.who{background:var(--cream);color:var(--ink);font-weight:600}
.tag.due{font-variant-numeric:tabular-nums}
.tag.due.late{background:#FDE7EF;color:var(--magenta-deep);font-weight:700}
.tag.due.soon{color:var(--ink);font-weight:700}
.tag.src{background:transparent;color:var(--g500);padding-left:0}
.msg{margin-top:7px;font-size:12.5px;color:var(--g700);border-left:2px solid var(--cream);
  padding:3px 0 3px 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st{flex:0 0 auto;border-radius:99px;padding:5px 12px;font-size:11.5px;font-weight:600;white-space:nowrap;
  border:1px solid transparent;min-width:96px;text-align:center;transition:.12s var(--ease)}
.st:hover{transform:scale(1.03)}
.st.s0{background:#fff;color:var(--g500);border:1px dashed var(--g300)}
.st.s1{background:#EDEAE3;color:var(--g700)}
.st.s2{background:var(--magenta);color:#fff}
.st.s3{background:var(--ink);color:var(--cream)}

/* ---------- tabule ---------- */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;align-items:start}
.col{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;min-height:130px}
.col.over{border-color:var(--magenta);box-shadow:0 0 0 3px rgba(255,26,107,.12)}
.col h3{margin:2px 4px 11px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--g500);display:flex;gap:8px;font-weight:600}
.col h3 b{color:var(--ink)}
.kart{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:grab}
.kart:hover{border-color:var(--g300);box-shadow:var(--sh)}
.kart b{display:block;font-size:13.5px;font-weight:600;line-height:1.3}
.kart .m{margin-top:7px;display:flex;flex-wrap:wrap;gap:5px;font-size:11.5px;color:var(--g500)}
.kart.drag{opacity:.35}
.empty{padding:56px 10px;text-align:center;color:var(--g500)}
.empty b{display:block;font-size:16px;color:var(--ink);margin-bottom:5px}

/* ---------- panel ---------- */
.ov{position:fixed;inset:0;background:rgba(14,14,16,.32);opacity:0;pointer-events:none;transition:opacity .2s var(--ease);z-index:50}
.ov.on{opacity:1;pointer-events:auto}
.dw{position:fixed;top:0;right:0;bottom:0;width:min(500px,95vw);background:#fff;z-index:60;
  box-shadow:-16px 0 50px rgba(14,14,16,.16);transform:translateX(100%);transition:transform .24s var(--ease);
  display:flex;flex-direction:column}
.dw.on{transform:none}
.dw .h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--cream)}
.dw .h b{font-size:14px;flex:1;font-weight:600;letter-spacing:.02em}
.dw .h .btn{background:transparent;color:var(--cream);border-color:rgba(245,235,214,.3)}
.dw .h .btn:hover{background:rgba(245,235,214,.12)}
.dw .c{flex:1;overflow:auto;padding:20px}
.dw .f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px;align-items:center;background:var(--soft)}
.fld{margin-bottom:15px}
.fld label{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--g500);margin-bottom:6px;font-weight:600}
.fld input,.fld select,.fld textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff}
.fld textarea{resize:vertical;min-height:80px;line-height:1.55}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--magenta);box-shadow:0 0 0 3px rgba(255,26,107,.12)}
.fld#f_ukol_w input{font-size:16px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.stpick{display:flex;gap:7px}
.stpick button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);font-size:13px;font-weight:600;background:#fff;color:var(--g700)}
.stpick button.on.s1{background:#EDEAE3;border-color:var(--g300);color:var(--g700)}
.stpick button.on.s2{background:var(--magenta);border-color:var(--magenta);color:#fff}
.stpick button.on.s3{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.hint{font-size:12px;color:var(--g500);margin:-8px 0 14px}
.link{color:var(--magenta-deep);font-weight:600;text-decoration:underline;font-size:12.5px}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:80;pointer-events:none}
.toast{background:var(--ink);color:var(--cream);padding:10px 18px;border-radius:99px;font-size:13px;box-shadow:var(--sh)}

/* ---------- tisk ---------- */
.printonly{display:none}
@media print{
  @page{size:A4 landscape;margin:12mm}
  body,main{overflow:visible;height:auto;display:block;background:#fff}
  .tools,.side,.dw,.ov,.seg,.gaps,#toast,.sec .tw{display:none!important}
  .st{background:none!important;color:var(--ink)!important;border:1px solid var(--g300)!important;min-width:0;padding:2px 9px;font-size:10.5px}
  .band{background:#fff;color:var(--ink);border-bottom:2px solid var(--ink);padding:0 0 10px}
  .band h1,.band .cil,.band .meta{color:var(--ink)}
  .glyph{background:var(--ink)} .wordmark{color:var(--ink)}
  .printonly{display:block}
  .row{break-inside:avoid;box-shadow:none;border-color:#ddd;padding:8px 10px}
  .row .p,.row .jak,.row .soucast,.msg{-webkit-line-clamp:unset;display:block}
  .sec{break-after:avoid}
  .card,.kpi,.mini-areas{break-inside:avoid}
}
@media (max-width:1180px){ .grid3{grid-template-columns:1fr 1fr} .board{grid-template-columns:1fr 1fr} }
@media (max-width:900px){
  .side{display:none}
  .grid3{grid-template-columns:1fr} .board{grid-template-columns:1fr}
  main{padding:18px 16px 80px}
  .band{flex-wrap:wrap;gap:10px;padding:12px 16px;align-items:center}
  .band .proj{flex:1 1 100%;order:2;gap:4px}
  .band .proj h1{font-size:19px;flex:1 1 100%}
  .band .cil{flex:1 1 100%}
  .band .sep{display:none}
  .band .meta{flex:1 1 100%;order:3;text-align:left;white-space:normal;line-height:1.5}
  .tools{padding:10px 16px}
  .marea{grid-template-columns:1fr 70px}
  .marea .sig{display:none}
}

function nacti(){

  return JSON.parse(JSON.stringify(VYCHOZI));
}

let nezalohovano = 0;
function uloz(){
  D.ulozeno = new Date().toISOString();
  try{ localStorage.setItem(KLIC, JSON.stringify(D)); }
  catch(e){ lbl('Nejde uložit do prohlížeče — stáhni JSON', true); return; }
  nezalohovano++; lbl();
}
function lbl(text, zly){
  const el = document.getElementById('savedLbl');
  if(text){ el.textContent = text; el.style.color = zly ? 'var(--magenta-deep)' : ''; return; }
  el.style.color = nezalohovano > 25 ? 'var(--magenta-deep)' : '';
  if(!D.ulozeno || D.ulozeno.indexOf('T') < 0){ el.textContent = 'Uloženo v prohlížeči'; return; }
  const t = new Date(D.ulozeno);
  el.textContent = 'Uloženo ' + String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0')
    + (nezalohovano > 25 ? ' · stáhni zálohu' : '');
}

const S = { oblast:null, kdo:'', stavy:new Set(), termin:'', bez:'', hledat:'', archiv:false,
            pohled:'prehled', razeni:'oblast', zavrene:new Set() };

const dnes = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function datum(iso, vzdyRok){
  if(!iso) return '';
  const p = String(iso).slice(0,10).split('-');
  if(p.length < 3) return String(iso);
  const rok = (!vzdyRok && p[0] === String(new Date().getFullYear())) ? '' : ' ' + p[0];
  return parseInt(p[2],10) + '. ' + parseInt(p[1],10) + '.' + rok;
}
function dueClass(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00'), t = dnes();
  if(d < t) return ' late';
  if((d - t)/86400000 <= 14) return ' soon';
  return '';
}
const oblastNazev = id => { const o = D.oblasti.find(x => x.id === id); return o ? o.nazev : '—'; };
const zive = () => D.ukoly.filter(u => !u.archiv);

function viditelne(){
  const q = S.hledat.trim().toLowerCase();
  return D.ukoly.filter(u => {
    if(!!u.archiv !== S.archiv) return false;
    if(S.oblast && u.oblast !== S.oblast) return false;
    if(S.kdo && !(u.kdo||'').toLowerCase().includes(S.kdo.toLowerCase())) return false;
    if(S.stavy.size && !S.stavy.has(u.stav||'')) return false;
    if(S.bez === 'stav' && (u.stav||'')) return false;
    if(S.bez === 'termin' && u.termin) return false;
    if(S.bez === 'kdo' && (u.kdo||'').trim()) return false;
    if(S.termin){
      if(!u.termin) return false;
      const c = dueClass(u.termin);
      if(S.termin === 'po' && c !== ' late') return false;
      if(S.termin === 'blizko' && c !== ' soon' && c !== ' late') return false;
    }
    if(q){
      const h = [u.ukol, u.popis, u.jak, u.soucast, u.kdo, u.zprava, u.zdroj, oblastNazev(u.oblast)].join(' ').toLowerCase();
      if(!h.includes(q)) return false;
    }
    return true;
  });
}
function serad(list){
  const k = list.slice(), poradi = {'V procesu':0, '':1, 'Nezačalo':2, 'Hotovo':3};
  if(S.razeni === 'termin') k.sort((a,b) => (a.termin||'9999').localeCompare(b.termin||'9999'));
  else if(S.razeni === 'stav') k.sort((a,b) => poradi[a.stav||''] - poradi[b.stav||'']);
  else if(S.razeni === 'zmena') k.sort((a,b) => (b.zmeneno||'').localeCompare(a.zmeneno||''));
  else k.sort((a,b) => a.oblast - b.oblast || a.id - b.id);
  return k;
}
function pocty(list){
  const c = s => list.filter(u => (u.stav||'') === s).length;
  return { celkem:list.length, h:c('Hotovo'), p:c('V procesu'), n:c('Nezačalo'), x:c('') };
}
function sigBar(list, mini){
  const q = pocty(list), t = q.celkem || 1;
  return '<div class="sig' + (mini ? ' mini' : '') + '">'
    + '<i class="h" style="width:' + (q.h/t*100) + '%"></i>'
    + '<i class="p" style="width:' + (q.p/t*100) + '%"></i>'
    + '<i class="n" style="width:' + (q.n/t*100) + '%"></i></div>';
}

  h += '<div class="card"><h3>Čeká na rozhodnutí</h3><div class="hint">Bez nich se ostatní úkoly nepohnou.</div><ul>'
     + (rozhodnuti.length ? rozhodnuti.slice(0,6).map(u => polozka(u, esc(oblastNazev(u.oblast)))).join('')
        : '<div class="none">Nic nečeká.</div>') + '</ul></div>';
  h += '<div class="card"><h3>Nejbližší termíny</h3><div class="hint">Co má datum a ještě není hotové.</div><ul>'
     + (terminy.length ? terminy.map(u => polozka(u, '<b class="' + (dueClass(u.termin).trim() === 'late' ? 'late' : '') + '">' + datum(u.termin) + '</b>')).join('')
        : '<div class="none">Žádné termíny.</div>') + '</ul></div>';
  h += '<div class="card"><h3>Naposledy změněné</h3><div class="hint">Co se v přehledu pohnulo.</div><ul>'
     + (zmeny.length ? zmeny.map(u => polozka(u, datum(u.zmeneno))).join('')
        : '<div class="none">Zatím nic. Změny se tu objeví, jakmile začneš klikat.</div>') + '</ul></div>';
  h += '</div>';

  h += '<div class="mini-areas"><h3 style="margin:0 0 12px;font-size:14.5px">Podle oblastí</h3>';
  D.oblasti.forEach(o => {
    const cl = z.filter(u => u.oblast === o.id); if(!cl.length) return;
    const p = pocty(cl);
    h += '<div class="marea" data-obl2="' + o.id + '"><div class="nm">' + esc(o.nazev) + '</div>'
       + sigBar(cl) + '<div class="cnt">' + p.h + ' / ' + p.celkem + '</div></div>';
  });
  h += '</div>';
  document.getElementById('main').innerHTML = h;
}

/* ---------- seznam a tabule ---------- */
function radek(u){
  let h = '<div class="row' + (u.stav==='Hotovo' ? ' done' : '') + '" data-id="' + u.id + '">';
  h += '<button class="st ' + STCLASS[u.stav||''] + '" data-cyk="' + u.id + '" title="Klikni a přepni stav">'
     + (u.stav === 'Hotovo' ? '✓ ' : '') + (u.stav || 'Doplnit stav') + '</button><div class="body">';
  h += '<div class="t">' + esc(u.ukol) + '</div>';
  if(u.popis) h += '<p class="p">' + esc(u.popis) + '</p>';
  if(u.jak) h += '<p class="jak"><b>Jak na to:</b> ' + esc(u.jak) + '</p>';
  if(u.soucast) h += '<p class="soucast"><b>Čeho je to součást:</b> ' + esc(u.soucast) + '</p>';
  if(u.zprava) h += '<div class="msg">' + esc(u.zprava) + '</div>';
  h += '<div class="m">';
  if(u.kdo) h += '<span class="tag who">' + esc(u.kdo) + '</span>';
  if(u.termin) h += '<span class="tag due' + dueClass(u.termin) + '">' + datum(u.termin) + '</span>';
  if(!(S.razeni === 'oblast' && !S.oblast)) h += '<span class="tag">' + esc(oblastNazev(u.oblast)) + '</span>';
  if(u.typ && u.typ !== 'Úkol') h += '<span class="tag">' + esc(u.typ) + '</span>';
  if(u.zdroj) h += '<span class="tag src">' + esc(u.zdroj) + '</span>';
  h += '</div></div></div>';
  return h;
}
function filtryPopis(){
  const f = [];
  if(S.oblast) f.push('oblast ' + oblastNazev(S.oblast));
  if(S.kdo) f.push('kdo: ' + S.kdo);
  S.stavy.forEach(v => f.push(v || 'bez stavu'));
  if(S.termin) f.push(S.termin === 'po' ? 'po termínu' : 'do 14 dní');
  if(S.bez) f.push(S.bez === 'stav' ? 'bez stavu' : S.bez === 'termin' ? 'bez termínu' : 'bez odpovědného');
  if(S.hledat) f.push('hledání „' + S.hledat + '“');
  return f;
}
function seznamRender(){
  const list = serad(viditelne()), f = filtryPopis();
  let h = '<div class="mhead"><div><div class="eyebrow">' + (S.archiv ? 'Archiv' : (S.oblast ? 'Oblast' : 'Seznam')) + '</div>'
    + '<h2>' + (S.oblast ? esc(oblastNazev(S.oblast)) : (S.archiv ? 'Archiv' : 'Všechny úkoly')) + '</h2>';
  if(S.oblast){ const o = D.oblasti.find(x => x.id === S.oblast); h += '<p>' + esc(o.popis) + '</p>'; }
  if(f.length) h += '<p style="margin-top:7px">Filtr: ' + esc(f.join(' · ')) + ' <button class="link" data-clear="vse">zrušit vše</button></p>';
  h += '</div><span class="cnt">' + list.length + ' z ' + zive().length + '</span></div>';
  if(!list.length){
    h += '<div class="empty"><b>Nic tu není</b>Zruš filtry, nebo přidej nový úkol.</div>';
    document.getElementById('main').innerHTML = h; return;
  }
  if(S.razeni === 'oblast' && !S.oblast){
    D.oblasti.forEach(o => {
      const cl = list.filter(u => u.oblast === o.id); if(!cl.length) return;
      const zav = S.zavrene.has(o.id), p = pocty(cl);
      h += '<div class="sec' + (zav ? ' closed' : '') + '" data-sec="' + o.id + '"><span class="tw">▼</span>'
         + '<h3>' + esc(o.nazev) + '</h3>' + sigBar(cl, true)
         + '<span class="cnt">' + p.h + ' / ' + p.celkem + '</span>'
         + '<span class="d">' + esc(o.popis) + '</span></div>';
      if(!zav) h += cl.map(radek).join('');
    });
  } else h += list.map(radek).join('');
  document.getElementById('main').innerHTML = h;
}
function tabuleRender(){
  const list = serad(viditelne());
  let h = '<div class="mhead"><div><div class="eyebrow">Tabule</div><h2>Co kde stojí</h2>'
    + '<p>Kartu přetáhni do jiného sloupce a stav se změní.</p></div>'
    + '<span class="cnt">' + list.length + ' úkolů</span></div><div class="board">';
  [['','Bez stavu'],['Nezačalo','Nezačalo'],['V procesu','V procesu'],['Hotovo','Hotovo']].forEach(([v,n]) => {
    const cl = list.filter(u => (u.stav||'') === v);
    h += '<div class="col" data-col="' + v + '"><h3>' + n + ' <b>' + cl.length + '</b></h3>';
    cl.forEach(u => {
      h += '<div class="kart" draggable="true" data-id="' + u.id + '"><b>' + esc(u.ukol) + '</b><div class="m">';
      if(u.kdo) h += '<span class="tag who">' + esc(u.kdo) + '</span>';
      if(u.termin) h += '<span class="tag due' + dueClass(u.termin) + '">' + datum(u.termin) + '</span>';
      h += '<span class="tag">' + esc(oblastNazev(u.oblast)) + '</span></div></div>';
    });
    h += '</div>';
  });
  document.getElementById('main').innerHTML = h + '</div>';
}
function hlavicka(){
  document.getElementById('projName').textContent = D.nazev || 'Úkoly';
  document.getElementById('projCil').textContent = D.cil || '';
  document.getElementById('projMeta').innerHTML = esc(D.autor || '') + '<br>' + (D.podtitul ? esc(D.podtitul) + ' · ' : '')
    + 'aktualizováno ' + datum(D.ulozeno, true);
  document.title = (D.nazev || 'Úkoly') + (D.podtitul ? ' — ' + D.podtitul : '');
}
function render(){
  hlavicka(); sideRender();
  if(S.pohled === 'prehled') prehledRender();
  else if(S.pohled === 'tabule') tabuleRender();
  else seznamRender();
}
function doSeznamu(){
  S.pohled = 'seznam';
  document.querySelectorAll('#views button').forEach(b => b.classList.toggle('on', b.dataset.v === 'seznam'));
}

/* ---------- panel detailu ---------- */
function otevri(id){
  const u = id === 'novy'
    ? { id:'novy', oblast:S.oblast || (D.oblasti[0] && D.oblasti[0].id) || 1, ukol:'', popis:'', typ:'Úkol', kdo:'', termin:'', stav:'', zprava:'', zdroj:'' }
    : D.ukoly.find(x => x.id === id);
  if(!u) return;
  const novy = id === 'novy', dw = document.getElementById('dw');
  let h = '<div class="h"><b>' + (novy ? 'Nový úkol' : esc(oblastNazev(u.oblast))) + '</b><button class="btn sm" data-x="1">Zavřít</button></div><div class="c">';
  h += '<div class="fld" id="f_ukol_w"><label>Úkol</label><input id="f_ukol" value="' + esc(u.ukol) + '" placeholder="Krátký název, srozumitelný sám o sobě"></div>';
  h += '<div class="fld"><label>Co to je a proč</label><textarea id="f_popis" placeholder="Dvě věty, ať to pochopí i ten, kdo u toho nebyl">' + esc(u.popis) + '</textarea></div>';
  h += '<div class="fld"><label>Jak na to</label><textarea id="f_jak" placeholder="Konkrétní kroky, aby to zvládl i někdo, kdo u toho nebyl">' + esc(u.jak||'') + '</textarea></div>';
  h += '<div class="fld"><label>Čeho je to součást</label><textarea id="f_soucast" placeholder="K čemu to patří a proč na tom záleží">' + esc(u.soucast||'') + '</textarea></div>';
  h += '<div class="fld"><label>Stav</label><div class="stpick">'
     + STAVY.map(s => '<button data-st="' + s + '" class="' + STCLASS[s] + (u.stav===s ? ' on' : '') + '">' + s + '</button>').join('')
     + '</div></div>';
  h += '<div class="two"><div class="fld"><label>Kdo</label><input id="f_kdo" list="lide" value="' + esc(u.kdo) + '" placeholder="Jméno nebo oddělení"></div>'
     + '<div class="fld"><label>Do kdy</label><input id="f_termin" type="date" value="' + esc(u.termin||'') + '"></div></div>';
  h += '<div class="two"><div class="fld"><label>Oblast</label><select id="f_oblast">'
     + D.oblasti.map(o => '<option value="' + o.id + '"' + (o.id===u.oblast ? ' selected' : '') + '>' + esc(o.nazev) + '</option>').join('')
     + '</select></div><div class="fld"><label>Typ</label><select id="f_typ">'
     + D.typy.map(t => '<option' + (t===u.typ ? ' selected' : '') + '>' + esc(t) + '</option>').join('') + '</select></div></div>';
  h += '<div class="fld"><label>Poslední zpráva</label><textarea id="f_zprava" placeholder="Co je u toho nového">' + esc(u.zprava) + '</textarea></div>';
  h += '<div class="hint"><button class="link" data-den="1">+ vložit dnešní datum</button> — zprávy piš za sebe, ať je vidět historie.</div>';
  h += '<div class="fld"><label>Zdroj</label><input id="f_zdroj" value="' + esc(u.zdroj) + '" placeholder="Odkud úkol je, například Tým 22. 9."></div>';
  if(!novy && u.zmeneno) h += '<div class="hint">Naposledy změněno ' + datum(u.zmeneno) + '</div>';
  h += '</div><div class="f"><button class="btn pri" data-save="1">' + (novy ? 'Přidat úkol' : 'Uložit') + '</button>'
     + '<button class="btn" data-x="1">Zrušit</button><span style="flex:1"></span>';
  if(!novy) h += '<button class="btn" data-arch="' + u.id + '">' + (u.archiv ? 'Vrátit z archivu' : 'Do archivu') + '</button>';
  h += '</div>';
  dw.innerHTML = h; dw.dataset.uid = String(id); dw.dataset.stav = u.stav || '';
  dw.classList.add('on'); document.getElementById('ov').classList.add('on');
  setTimeout(() => { const el = document.getElementById('f_ukol'); if(novy && el) el.focus(); }, 80);
}
function zavri(){ document.getElementById('dw').classList.remove('on'); document.getElementById('ov').classList.remove('on'); }
function ulozDetail(){
  const dw = document.getElementById('dw'), id = dw.dataset.uid;
  const v = x => { const el = document.getElementById(x); return el ? el.value.trim() : ''; };
  if(!v('f_ukol')){ toast('Napiš název úkolu'); return; }
  const z = { ukol:v('f_ukol'), popis:v('f_popis'), jak:v('f_jak'), soucast:v('f_soucast'), typ:v('f_typ'), kdo:v('f_kdo'), termin:v('f_termin') || null,
              stav:dw.dataset.stav || '', zprava:v('f_zprava'), zdroj:v('f_zdroj'),
              oblast:parseInt(v('f_oblast'),10), zmeneno:new Date().toISOString() };
  if(id === 'novy'){ D.ukoly.push(Object.assign({ id: Math.max(0, ...D.ukoly.map(u => u.id)) + 1, archiv:false }, z)); toast('Úkol přidán'); }
  else { Object.assign(D.ukoly.find(u => u.id === parseInt(id,10)), z); toast('Uloženo'); }
  uloz(); zavri(); render();
}
function toast(t){
  const el = document.getElementById('toast');
  el.innerHTML = '<div class="toast">' + esc(t) + '</div>';
  clearTimeout(el._t); el._t = setTimeout(() => el.innerHTML = '', 2400);
}

/* ---------- soubory ---------- */
function stahni(jmeno, text, typ){
  const b = new Blob([text], { type: typ || 'application/json;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = jmeno;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
}
const dnesniKod = () => new Date().toISOString().slice(0,10);
const zakladJmena = () => (D.soubor || 'ukoly');
function exportJSON(){ stahni(zakladJmena() + '_' + dnesniKod() + '.json', JSON.stringify(D, null, 1)); nezalohovano = 0; lbl(); toast('Staženo jako JSON'); }
function exportCSV(){
  const hl = ['Č.','Oblast','Úkol','Co to je a proč','Jak na to','Čeho je to součást','Typ','Kdo','Do kdy','Stav','Poslední zpráva','Zdroj'];
  const b = s => '"' + String(s==null?'':s).replace(/"/g,'""') + '"';
  const rows = [hl.map(b).join(';')];
  serad(zive()).forEach(u => rows.push([u.id, oblastNazev(u.oblast), u.ukol, u.popis, u.jak||'', u.soucast||'', u.typ, u.kdo,
    u.termin ? datum(u.termin, true) : '', u.stav, u.zprava, u.zdroj].map(b).join(';')));
  stahni(zakladJmena() + '_' + dnesniKod() + '.csv', '﻿' + rows.join('\r\n'), 'text/csv;charset=utf-8');
  toast('Staženo jako CSV');
}
function importJSON(f){
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!d || !Array.isArray(d.ukoly) || !Array.isArray(d.oblasti)) throw 0;
      if(!confirm('Načíst ' + d.ukoly.length + ' úkolů ze souboru? Nahradí to, co je teď v prohlížeči.')) return;
      D = d; uloz(); render(); toast('Načteno');
    }catch(e){ alert('Tenhle soubor nevypadá jako data úkolů.'); }
  };
  r.readAsText(f);
}

/* ---------- události ---------- */
document.addEventListener('click', e => {
  const t = e.target, zav = x => t.closest('[' + x + ']');

  const cyk = zav('data-cyk');
  if(cyk){
    e.stopPropagation();
    const u = D.ukoly.find(x => x.id === parseInt(cyk.dataset.cyk,10));
    u.stav = STAVY[(STAVY.indexOf(u.stav) + 1) % STAVY.length];
    u.zmeneno = new Date().toISOString();
    uloz(); render(); return;
  }
  const row = t.closest('main') ? zav('data-id') : null;
  if(row && !t.closest('.st')){ otevri(parseInt(row.dataset.id,10)); return; }
  const o2 = zav('data-obl2');
  if(o2){ S.oblast = parseInt(o2.dataset.obl2,10); S.archiv = false; doSeznamu(); render(); return; }
  const bez = zav('data-bez');
  if(bez){ S.bez = (S.bez === bez.dataset.bez) ? '' : bez.dataset.bez; S.stavy.clear(); S.oblast = null; S.termin = ''; doSeznamu(); render(); return; }

  const obl = zav('data-obl');
  if(obl){ S.oblast = obl.dataset.obl ? parseInt(obl.dataset.obl,10) : null; S.archiv = false; if(S.pohled === 'prehled') doSeznamu(); render(); return; }
  const arch = zav('data-arch');
  if(arch && t.closest('.side')){ S.archiv = true; S.oblast = null; doSeznamu(); render(); return; }
  const st = zav('data-stav');
  if(st && t.closest('.side')){ const v = st.dataset.stav; S.stavy.has(v) ? S.stavy.delete(v) : S.stavy.add(v); S.bez = ''; if(S.pohled === 'prehled') doSeznamu(); render(); return; }
  const te = zav('data-term');
  if(te){ S.termin = S.termin === te.dataset.term ? '' : te.dataset.term; if(S.pohled === 'prehled') doSeznamu(); render(); return; }
  const sec = zav('data-sec');
  if(sec){ const id = parseInt(sec.dataset.sec,10); S.zavrene.has(id) ? S.zavrene.delete(id) : S.zavrene.add(id); seznamRender(); return; }
  const cl = zav('data-clear');
  if(cl){ S.oblast=null; S.kdo=''; S.stavy.clear(); S.termin=''; S.bez=''; S.hledat=''; document.getElementById('q').value=''; render(); return; }

  if(zav('data-x')){ zavri(); return; }
  if(zav('data-save')){ ulozDetail(); return; }
  const dst = zav('data-st');
  if(dst && t.closest('.dw')){
    const dw = document.getElementById('dw'), v = dst.dataset.st;
    dw.dataset.stav = (dw.dataset.stav === v) ? '' : v;
    dw.querySelectorAll('.stpick button').forEach(b => b.classList.toggle('on', b.dataset.st === dw.dataset.stav));
    return;
  }
  if(zav('data-den')){
    const el = document.getElementById('f_zprava'), d = new Date();
    const p = d.getDate() + '. ' + (d.getMonth()+1) + '.: ';
    el.value = el.value ? (el.value + '\n' + p) : p;
    el.focus(); el.setSelectionRange(el.value.length, el.value.length); return;
  }
  const da = zav('data-arch');
  if(da && t.closest('.dw')){
    const u = D.ukoly.find(x => x.id === parseInt(da.dataset.arch,10));
    u.archiv = !u.archiv; u.zmeneno = new Date().toISOString();
    uloz(); zavri(); render(); toast(u.archiv ? 'Úkol je v archivu, nic se nemaže' : 'Úkol je zpátky'); return;
  }
  if(t.id === 'ov'){ zavri(); return; }

  if(t.id === 'new'){ otevri('novy'); return; }
  if(t.id === 'menuBtn'){ document.getElementById('menu').classList.toggle('on'); return; }
  const v = zav('data-v');
  if(v){
    S.pohled = v.dataset.v;
    document.querySelectorAll('#views button').forEach(b => b.classList.toggle('on', b === v));
    render(); return;
  }
  const a = zav('data-a');
  if(a){
    document.getElementById('menu').classList.remove('on');
    const k = a.dataset.a;
    if(k === 'export') exportJSON();
    if(k === 'csv') exportCSV();
    if(k === 'import') document.getElementById('file').click();
    if(k === 'print'){ if(S.pohled === 'tabule') doSeznamu(), render(); window.print(); }
    if(k === 'area'){
      const n = prompt('Název nové oblasti:');
      if(n && n.trim()){
        const p = prompt('Jednou větou, co do oblasti patří:') || '';
        D.oblasti.push({ id: Math.max(0, ...D.oblasti.map(o => o.id)) + 1, nazev:n.trim(), popis:p.trim() });
        uloz(); render(); toast('Oblast přidána');
      }
    }
    if(k === 'reset' && confirm('Vrátit se k datům, se kterými soubor přišel? Přijdeš o změny, které nemáš stažené v JSON.')){
      D = JSON.parse(JSON.stringify(VYCHOZI)); uloz(); render(); toast('Výchozí data načtena');
    }
    return;
  }
  if(!t.closest('.menu-wrap')) document.getElementById('menu').classList.remove('on');
});

document.addEventListener('change', e => {
  if(e.target.id === 'kdo'){ S.kdo = e.target.value; if(S.pohled === 'prehled') doSeznamu(); render(); }
  if(e.target.id === 'razeni'){ S.razeni = e.target.value; render(); }
  if(e.target.id === 'file' && e.target.files[0]){ importJSON(e.target.files[0]); e.target.value = ''; }
});
document.getElementById('q').addEventListener('input', e => {
  S.hledat = e.target.value;
  if(S.pohled === 'prehled' && S.hledat){ doSeznamu(); render(); return; }
  if(S.pohled === 'seznam') seznamRender(); else render();
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') zavri();
  const vstup = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if(e.key === '/' && !vstup){ e.preventDefault(); document.getElementById('q').focus(); }
  if(e.key === 'n' && !vstup){ e.preventDefault(); otevri('novy'); }
  if((e.ctrlKey || e.metaKey) && e.key === 's'){ e.preventDefault(); exportJSON(); }
  if((e.ctrlKey || e.metaKey) && e.key === 'Enter' && document.getElementById('dw').classList.contains('on')) ulozDetail();
});

let tahany = null;
document.addEventListener('dragstart', e => {
  const c = e.target.closest('.kart'); if(!c) return;
  tahany = parseInt(c.dataset.id,10); c.classList.add('drag');
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', String(tahany)); }catch(err){}
});
document.addEventListener('dragend', () => {
  document.querySelectorAll('.kart.drag').forEach(c => c.classList.remove('drag'));
  document.querySelectorAll('.col.over').forEach(c => c.classList.remove('over'));
});
document.addEventListener('dragover', e => {
  const col = e.target.closest('.col'); if(!col) return;
  e.preventDefault();
  document.querySelectorAll('.col.over').forEach(c => c.classList.remove('over'));
  col.classList.add('over');
});
document.addEventListener('drop', e => {
  const col = e.target.closest('.col'); if(!col || tahany == null) return;
  e.preventDefault();
  const u = D.ukoly.find(x => x.id === tahany);
  if(u){ u.stav = col.dataset.col; u.zmeneno = new Date().toISOString(); uloz(); render(); }
  tahany = null;
});

const dl = document.createElement('datalist');
dl.id = 'lide';
dl.innerHTML = D.lide.map(p => '<option value="' + esc(p.jmeno) + '">').join('');
document.body.appendChild(dl);

lbl();
render();
</script>
</body>
</html>
