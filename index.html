<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Úkolník iDNES Premium</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Rozvržení: tmavý pruh s projektem, pod ním lišta filtrů, vlevo oblasti, vpravo seznam. Detail v šuplíku zprava. */
:root{
  --podklad:#F3F0E9; --list:#FFFFFF; --text:#17171A; --text2:#56565E; --text3:#8B8B93;
  --linka:#E4E0D6; --linka2:#F0ECE3; --akcent:#FF1A6B; --akcent2:#C70054;
  --hotovo:#2E7D5B; --pozor:#B4620A; --kremova:#F5EBD6; --tmava:#121214;
  --pismo:'Inter',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --pismo2:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --podklad:#131316; --list:#1B1B1F; --text:#F2F0EB; --text2:#B4B2AC; --text3:#86848O;
  --text3:#86848C; --linka:#2E2E34; --linka2:#26262B; --akcent:#FF3D85; --akcent2:#FF6AA0;
  --hotovo:#5FBF92; --pozor:#E09A4A; --kremova:#F5EBD6; --tmava:#09090B; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --podklad:#131316; --list:#1B1B1F; --text:#F2F0EB; --text2:#B4B2AC; --text3:#86848C;
  --linka:#2E2E34; --linka2:#26262B; --akcent:#FF3D85; --akcent2:#FF6AA0;
  --hotovo:#5FBF92; --pozor:#E09A4A; --kremova:#F5EBD6; --tmava:#09090B; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--podklad);color:var(--text);font:15px/1.55 var(--pismo);
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--akcent);outline-offset:2px;border-radius:5px}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.015em}
p{margin:0 0 10px}
.mono{font-family:var(--pismo2);font-variant-numeric:tabular-nums}

/* pruh */
.pruh{flex:0 0 auto;background:var(--tmava);color:var(--kremova);
  padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.znacka{display:flex;align-items:center;gap:10px}
.znak{position:relative;width:7px;height:28px;background:var(--kremova);border-radius:1px}
.znak i{position:absolute;left:50%;top:19%;transform:translateX(-50%);width:2px;height:62%;background:var(--akcent)}
.jmeno{font-size:10.5px;font-weight:600;letter-spacing:.22em}
.pruh h1{font-size:16px;color:#fff}
.pruh .cil{font-size:12.5px;color:rgba(245,235,214,.65)}
.pruh .vpravo{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:rgba(245,235,214,.65)}
.pruh select{background:rgba(245,235,214,.1);border:1px solid rgba(245,235,214,.22);color:var(--kremova);
  border-radius:7px;padding:5px 9px;font-size:12.5px}

/* lišta */
.lista{flex:0 0 auto;background:var(--list);border-bottom:1px solid var(--linka);
  padding:9px 20px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.prep{display:flex;background:var(--podklad);border-radius:9px;padding:3px;gap:2px}
.prep button{padding:6px 13px;font-size:13.5px;font-weight:500;color:var(--text2);border-radius:7px}
.prep button.on{background:var(--tmava);color:var(--kremova);font-weight:600}
.hledat{flex:1;min-width:150px;max-width:300px}
.hledat input{width:100%;padding:8px 11px;border:1px solid var(--linka);border-radius:9px;background:var(--list)}
.hledat input::placeholder{color:var(--text3)}
.lista select{padding:7px 10px;border:1px solid var(--linka);border-radius:9px;background:var(--list);font-size:13.5px}
.tl{padding:7px 12px;border:1px solid var(--linka);border-radius:9px;background:var(--list);
  font-size:13.5px;font-weight:500;white-space:nowrap}
.tl:hover{border-color:var(--text3)}
.tl.on{background:var(--tmava);color:var(--kremova);border-color:var(--tmava)}
.tl.hlavni{background:var(--akcent);color:#fff;border-color:var(--akcent);font-weight:600}
.ulozeno{margin-left:auto;font-size:12px;color:var(--text3);white-space:nowrap}

/* rozvržení */
.telo{flex:1;display:flex;min-height:0}
.bok{flex:0 0 244px;border-right:1px solid var(--linka);overflow:auto;padding:14px 10px 40px;background:var(--list)}
.bok h4{margin:16px 8px 7px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--akcent)}
.bok h4:first-child{margin-top:0}
.pol{display:block;width:100%;text-align:left;padding:7px 9px;border-radius:8px;color:var(--text2);font-size:13.5px;line-height:1.3}
.pol:hover{background:var(--podklad)}
.pol.on{background:var(--tmava);color:var(--kremova)}
.pol .r{display:flex;align-items:center;gap:8px}
.pol .n{flex:1;min-width:0}
.pol .c{font-size:11.5px;color:var(--text3);font-variant-numeric:tabular-nums}
.pol.on .c{color:rgba(245,235,214,.6)}
.pas{display:flex;height:4px;border-radius:99px;overflow:hidden;background:var(--linka2);margin-top:5px}
.pas i{display:block;height:100%}
.pas .h{background:var(--hotovo)} .pas .p{background:var(--akcent)} .pas .n{background:var(--linka)}
.pol.on .pas{background:rgba(245,235,214,.2)}

main{flex:1;overflow:auto;padding:20px 24px 80px;min-width:0}
.obal{max-width:1120px}
.nadpis{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.nadpis h2{font-size:25px;line-height:1.1}
.nadpis p{margin:5px 0 0;font-size:13.5px;color:var(--text2);max-width:72ch}
.nadpis .poc{margin-left:auto;font-size:12.5px;color:var(--text3);white-space:nowrap}

/* karty a čísla */
.karta{background:var(--list);border:1px solid var(--linka);border-radius:13px;padding:18px 20px;margin-bottom:14px}
.ctyri{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.cis{background:var(--list);border:1px solid var(--linka);border-radius:13px;padding:16px 18px}
.cis b{display:block;font-size:34px;font-weight:400;letter-spacing:-.04em;line-height:1;margin-bottom:6px;font-family:var(--pismo2)}
.cis span{font-size:12.5px;color:var(--text2)}
.cis.varuj b{color:var(--pozor)}

/* řádky */
.sek{margin-bottom:20px}
.sek h3{font-size:14.5px;margin:0 0 4px}
.sek .pod{font-size:12.5px;color:var(--text3);margin-bottom:9px}
.radek{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;border:1px solid var(--linka);
  border-radius:11px;background:var(--list);margin-bottom:7px;cursor:pointer}
.radek:hover{border-color:var(--text3)}
.radek .txt{flex:1;min-width:0}
.radek .nm{font-size:14.5px;font-weight:500;line-height:1.35}
.radek .meta{margin-top:4px;font-size:12px;color:var(--text3);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.radek .meta b{color:var(--text2);font-weight:500}
.radek .vic{margin:6px 0 0;font-size:13px;line-height:1.5;color:var(--text2)}
.radek .vic b{color:var(--text);font-weight:600}
.radek .vic.zpr{border-left:2px solid var(--akcent);padding-left:9px}
.chip{border:1px solid var(--linka);border-radius:99px;padding:3px 10px;font-size:11.5px;font-weight:600;white-space:nowrap}
.chip.s0{color:var(--text3)}
.chip.s1{color:var(--text2)}
.chip.s2{background:var(--akcent);border-color:var(--akcent);color:#fff}
.chip.s3{background:var(--hotovo);border-color:var(--hotovo);color:#fff}
.chip.p1{background:var(--tmava);border-color:var(--tmava);color:var(--kremova)}
.chip.p2{color:var(--text2)}
.chip.p3{color:var(--text3)}
.chip.po{color:var(--pozor);border-color:var(--pozor)}
.chip.as{color:var(--akcent2);border-color:var(--akcent2)}
.znacka-as{font-family:var(--pismo2);font-size:11px}

/* šuplík */
.stin{position:fixed;inset:0;background:rgba(10,10,12,.42);opacity:0;pointer-events:none;transition:.18s;z-index:60}
.stin.on{opacity:1;pointer-events:auto}
.suplik{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--list);
  border-left:1px solid var(--linka);transform:translateX(100%);transition:.22s cubic-bezier(.2,.8,.2,1);
  z-index:61;display:flex;flex-direction:column}
.suplik.on{transform:none}
.suplik .hlava{padding:16px 20px;border-bottom:1px solid var(--linka);display:flex;align-items:flex-start;gap:12px}
.suplik .hlava h3{font-size:17px;flex:1;min-width:0}
.suplik .telo2{flex:1;overflow:auto;padding:18px 20px 40px}
.suplik .pata{padding:12px 20px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--linka);display:flex;gap:9px;flex-wrap:wrap}
.pole{margin-bottom:14px}
.pole label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--akcent);font-weight:600;margin-bottom:5px}
.pole input,.pole select,.pole textarea{width:100%;padding:9px 11px;border:1px solid var(--linka);
  border-radius:9px;background:var(--list)}
.pole textarea{min-height:76px;resize:vertical}
.dvojice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cteni{font-size:14px;color:var(--text2);margin-bottom:14px}
.cteni b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--akcent);margin-bottom:4px;font-weight:600}
.zdroj{font-size:12px;color:var(--text3);font-family:var(--pismo2)}

.hlaska{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--tmava);
  color:var(--kremova);padding:10px 18px;border-radius:99px;font-size:13.5px;opacity:0;pointer-events:none;
  transition:.2s;z-index:80}
.hlaska.on{opacity:1;transform:translateX(-50%)}
.prazdno{padding:40px 0;color:var(--text3);font-size:14px}

@media (max-width:860px){
  body{overflow:auto}
  .telo{flex-direction:column}
  .bok{flex:none;width:auto;border-right:0;border-bottom:1px solid var(--linka);max-height:none;padding:12px 16px 16px}
  .pol{display:inline-block;width:auto;margin:0 5px 5px 0;border:1px solid var(--linka)}
  .pas{display:none}
  main{padding:16px 16px 60px}
  .ctyri{grid-template-columns:1fr 1fr}
  .dvojice{grid-template-columns:1fr}
  .pruh,.lista{padding-left:16px;padding-right:16px}
}
</style>
</head>
<body>


<div class="pruh">
  <div class="znacka"><span class="znak"><i></i></span><span class="jmeno">iMEDIATIC</span></div>
  <div><h1>Úkolník iDNES Premium</h1></div>
  <div class="cil" id="cil"></div>
  <div class="vpravo">
    <span>Jsem</span>
    <select id="jaJsem" aria-label="Kdo jsem"></select>
  </div>
</div>

<div class="lista">
  <div class="prep" id="pohledy">
    <button data-p="prehled" class="on">Přehled</button>
    <button data-p="seznam">Seznam</button>
    <button data-p="lide">Podle lidí</button>
  </div>
  <div class="hledat"><input id="q" type="search" placeholder="Hledat v úkolech"></div>
  <select id="fStav" aria-label="Stav"><option value="">Každý stav</option></select>
  <select id="fPrio" aria-label="Priorita"><option value="">Každá priorita</option></select>
  <select id="fTermin" aria-label="Termín">
    <option value="">Všechny termíny</option>
    <option value="po">Po termínu</option>
    <option value="tyden">Do sedmi dnů</option>
    <option value="bez">Bez termínu</option>
  </select>
  <button class="tl" id="jenMoje">Moje úkoly</button>
  <button class="tl" id="jenAsana">Do Asany</button>
  <button class="tl on" id="detaily">Detaily</button>
  <button class="tl hlavni" id="novy">Nový úkol</button>
  <button class="tl" id="proAsanu">Zkopírovat pro Asanu</button>
  <span class="ulozeno" id="stavUloz">načítám…</span>
</div>

<div class="telo">
  <nav class="bok" id="bok"></nav>
  <main><div class="obal" id="hlavni"></div></main>
</div>

<div class="stin" id="stin"></div>
<aside class="suplik" id="suplik" aria-hidden="true">
  <div class="hlava"><h3 id="dwNadpis">Úkol</h3><button class="tl" id="zavrit">Zavřít</button></div>
  <div class="telo2" id="dwTelo"></div>
  <div class="pata"><button class="tl hlavni" id="ulozit">Uložit</button><button class="tl" id="zrusit">Zrušit</button></div>
</aside>
<div class="hlaska" id="hlaska"></div>

<script>
"use strict";
const ZAKLAD = {"nazev":"iDNES Premium","podtitul":"Přehled úkolů","cil":"Cíl: 200 tisíc předplatitelů do konce roku 2027","verze":5,"ulozeno":"2026-10-02","oblasti":[{"id":1,"nazev":"Obsah","popis":"Co Premium čtenářům dává: plán obsahu, seriály a články z novin a časopisů vydavatelství. Podle schválené strategie je obsah hlavní důvod, proč si lidé Premium koupí. Všechno ostatní jen pomáhá, aby ho našli."},{"id":2,"nazev":"Marketing a propagace obsahu","popis":"Jak se lidé dozvědí, co v Premiu je. Patří sem balení seriálů, upoutávky na vlastních plochách iDNESu, e-maily, kampaně a spolupráce uvnitř vydavatelství."},{"id":3,"nazev":"Výkladní skříň Premia na titulní straně iDNES.cz","popis":"Místo na titulní straně iDNES.cz, kde Premium uvidí i člověk, který zatím neplatí. Patří sem i pruh úplně nahoře a místo Premia v hlavním menu."},{"id":4,"nazev":"Vstupní stránka, nabídka a cena","popis":"Stránka, na které si čtenář Premium kupuje, a co mu na ní nabídneme: úrovně předplatného, ceny a vyzkoušení za korunu."},{"id":5,"nazev":"Stránky a funkce Premia na webu","popis":"Co předplatitel na webu dostane navíc a jak to pozná. Patří sem stránky Premia, podoba článku a funkce jako poslech, uložení nebo shrnutí."},{"id":6,"nazev":"Zamykání obsahu a freemium","popis":"Co se zamyká a podle čeho. Patří sem i rozhodnutí o freemiu, tedy jestli registrovaný čtenář dostane část obsahu zdarma a teprve pak narazí na nabídku předplatného."},{"id":7,"nazev":"Diskuse","popis":"Diskuse pod články jako cesta k registraci a k předplatnému. Je to místo, kam lidé chodí sami a pravidelně, a dnes z toho Premium nic nemá."},{"id":8,"nazev":"Aplikace","popis":"Nová mobilní aplikace iDNES: kdy se spustí, co v ní bude jen pro předplatitele a jak se v ní Premium prodá."},{"id":9,"nazev":"Udržení předplatitelů","popis":"Aby předplatitelé neodcházeli. Získat nového člověka stojí víc než udržet toho, kterého už máme, a dnes o odcházejícím čtenáři nevíme, dokud nezruší platbu."},{"id":10,"nazev":"Data a měření","popis":"Čísla, podle kterých se rozhoduje. Dnes má každý svá a liší se, takže se na poradách řeší, čí čísla platí, místo toho, co s nimi."},{"id":11,"nazev":"Značka","popis":"Co je iDNES Premium a jak o něm dům mluví. Když každý používá jiná slova, čtenář neví, co si kupuje."},{"id":12,"nazev":"Lidé a role","popis":"Lidé, kteří Premium dělají. Dnes chybí hlavně člověk, který za obsah odpovídá, a člověk, který ho umí zabalit a propagovat."},{"id":13,"nazev":"Řízení a rozhodnutí vedení","popis":"Rozhodnutí, bez kterých se plán nepohne, a pravidelné řízení projektu: kdo rozhoduje, kdy se kontroluje stav a kde jsou úkoly vidět."},{"id":14,"nazev":"Celý dům, partneři a sport","popis":"Kroky, které rozšíří Premium za hranice iDNESu: tištěné tituly, jedno přihlášení, partneři, firmy a sport. Většina má termín až v roce 2027."}],"lide":["Jakub Strýček","Michal Hanák","Franta","Matyáš Kaiser","Lukáš","Andrea","Petr Kelin","Luboš (šéf grafiky)","Zdeněk Šuster","Lubor Černohlávek","Markéta","Beránek","Palkovič","Hronová","Kabrna","Martin","produkt","vývoj","marketing","data","obchod","finance","tisk a tituly","sport","redakce","Michal Kolínský","Aleš","grafika"],"ukoly":[{"id":1,"oblast":1,"ukol":"Sestavit plán obsahu Premia na příští měsíc","popis":"Seznam toho, co Premium v příštím měsíci vydá a kdy. Skládá se ze seriálů, které dům už má hotové, a z nových, které navrhnou redakce. Bez takového plánu marketing neví, co má lidem dopředu oznámit, a čtenář nemá důvod se vracet.","jak":"Matyáš plán skládá z archivu a z návrhů redakcí, prochází se na úterním review. Výsledek je jednoduchý kalendář: co vyjde, kdy a kdo to má na starosti.","soucast":"Patří do obsahu, tedy do toho hlavního, proč si lidé Premium kupují. Zároveň je to vstup pro marketing a pro výkladní skříň na titulce, které bez něj nemají co nabízet.","typ":"Úkol","kdo":"Matyáš Kaiser, Jakub Strýček","termin":null,"stav":"V procesu","priorita":"","zprava":"22. 9.: Matyáš plán připravuje. Prošli jsme seriály, které dům už má.","zdroj":"Úkoly 17. 9.; Tým 22. 9.; Vedení 22. 9."},{"id":2,"oblast":1,"ukol":"Vybrat tři nové seriály, které vyjdou do konce roku","popis":"Redakce navrhnou tři seriály: o kriminalitě, o zdraví a o sportu. Seriál je několik dílů na jedno téma, které vycházejí po sobě, takže se kvůli nim čtenář vrací. Krimi a zdraví podle dat přivádějí nové předplatitele nejspolehlivěji, u sportu vidí tým velký potenciál, který zatím nikdo nevyužil.","jak":"Každá redakce pošle návrh: téma, kolik dílů, kdo je napíše a kdy by to vyšlo. Ze všech návrhů se vyberou tři a zařadí do měsíčního plánu. Redakce mají návrhy dodat tento týden.","soucast":"Patří do obsahu. Nové seriály jsou spolu s archivními hlavní věc, kterou Premium nabízí jako důvod k zaplacení.","typ":"Úkol","kdo":"Matyáš Kaiser","termin":"2026-10-09","stav":"V procesu","priorita":"Teď","zprava":"22. 9.: redakce mají návrhy dodat tento týden. 2. 10.: termín 25. 9. prošel, návrhy od redakcí pořád nejsou všechny. Nový termín čtvrtek 9. 10.","zdroj":"Tým 22. 9.; Rozbor 21. 9."},{"id":3,"oblast":1,"ukol":"Vytáhnout hotové seriály z archivu a nabídnout je jako ucelené řady","popis":"Dům má za léta hodně dobrých seriálů, třeba Z tajných sejfů Milana Vodičky. Dnes je čtenář nenajde, protože díly leží v archivu jednotlivě. Stačí je poskládat dohromady a nabídnout jako celek. Je to nejlevnější obsah, jaký můžeme mít: je napsaný a zaplacený.","jak":"Projít archiv a vybrat řady, které obstojí i dnes. Ke každé udělat stránku, kde jsou díly za sebou. Sezónní témata, třeba přijímačky, pouštět jen v době, kdy je lidé řeší.","soucast":"Patří do obsahu. Je to rychlá cesta, jak mít v Premiu co nabízet, než začnou vycházet nové seriály.","typ":"Úkol","kdo":"Matyáš Kaiser","termin":null,"stav":"V procesu","priorita":"","zprava":"22. 9.: seriály, které dům má, jsme prošli s Matyášem.","zdroj":"Tým 22. 9.; Vedení 22. 9."},{"id":4,"oblast":1,"ukol":"Ukázat v Premiu obsah z časopisu Téma a z dalších titulů","popis":"Celé Téma je v Premiu už dnes, jenom o tom čtenáři nevědí. Přitom zhruba desetina lidí, kteří si Premium koupí, přijde právě kvůli němu. Články z něj se musí každý den vybrat, poskládat a dát jim titulek, který někoho zaujme, jinak mezi ostatními zapadnou.","jak":"Někdo musí denně projít nové vydání, vybrat z něj, co se hodí, a napsat poutavé titulky. Na tuhle práci je vybraný Lubor Černohlávek z Tématu, viz oblast Lidé a role. Rozhovor z titulní strany dnes vychází s týdenním zpožděním, to se má srovnat.","soucast":"Patří do obsahu a zároveň do propojení Premia se zbytkem vydavatelství. Časopisy a noviny jsou obsah, za který dům už zaplatil, a Premium ho může nabídnout znovu.","typ":"Úkol","kdo":"Franta","termin":"2026-10-31","stav":"V procesu","priorita":"Teď","zprava":"14. 9.: Téma je v Premiu celé, jen rozhovor z titulní strany vychází s týdenním zdržením. 22. 9.: na skládání je vybraný Lubor Černohlávek (viz Lidé a role). 2. 10.: termín 30. 9. prošel. Posunuto na konec října, váže se na hledání člověka, který bude obsah z časopisů skládat denně.","zdroj":"Plán 14. 9.; Schůzka 14. 9.; Vedení 22. 9."},{"id":5,"oblast":1,"ukol":"Udělat z Tématu samostatnou rubriku Premia","popis":"Téma by mělo mít v Premiu vlastní místo, ne být rozpuštěné mezi ostatními články. František to chce i proto, aby se dalo spočítat, kolik peněz Téma Premiu přináší, a část jich vrátit redakci, která ho dělá.","jak":"Založit rubriku s vlastní stránkou a měřit ji zvlášť. Jak přesně se příjem bude dělit, zatím dohodnuté není.","soucast":"Patří do obsahu. Je to zároveň způsob, jak přesvědčit redakce ostatních titulů, že se jim vyplatí dávat svou práci do Premia.","typ":"Úkol","kdo":"Franta","termin":null,"stav":"","priorita":"","zprava":"","zdroj":"Schůzka 14. 9."},{"id":6,"oblast":1,"ukol":"Naplánovat obsah na půl roku dopředu","popis":"Plán toho, co Premium vydá v příštích šesti měsících, ve třech okruzích: servis (co čtenáři poradí), příběhy (co ho vtáhnou) a kontext (co mu vysvětlí, co se děje). Když plán není, marketing nemá co oznamovat dopředu a kampaně se dělají narychlo.","jak":"Vyjít z měsíčního plánu a natáhnout ho dál. Stačí hrubý rozvrh: velké téma na každý měsíc, k němu seriály a pravidelné rubriky. Ne hotové články.","soucast":"Patří do obsahu a je to podklad pro kampaně i pro výkladní skříň na titulce.","typ":"Úkol","kdo":"Matyáš Kaiser","termin":"2026-10-31","stav":"","priorita":"Teď","zprava":"","zdroj":"Plán 14. 9."},{"id":7,"oblast":1,"ukol":"Spustit pravidelný Test týdne každé úterý","popis":"Každé úterý vyjde v Premiu jeden test: co se vyplatí koupit a co za co stojí. Přebírá se z úterních Testů kvality v MF DNES, takže nevzniká nová práce. Pravidelnost je celý trik. Čtenář si zvykne, že v úterý něco přijde, a vrací se sám.","jak":"Stálý název, stálé místo na stránce a stálý den. První Test týdne má podle plánu vyjít 6. října.","soucast":"Patří do obsahu. Pravidelné rubriky drží lidi u předplatného mezi velkými tématy.","typ":"Úkol","kdo":"Matyáš Kaiser, redakce","termin":"2026-10-06","stav":"","priorita":"Teď","zprava":"Podle plánu první Test týdne vyjde 6. 10.","zdroj":"Plán 14. 9.; Návrh 17. 9."},{"id":8,"oblast":1,"ukol":"Domluvit, jak se texty z novin dostanou do Premia","popis":"Články z tištěných novin se musí převést a upravit tak, aby se daly číst na webu. Dnes na to není pevný postup, takže obsah, který dům už má a zaplatil, se k předplatitelům nedostane.","jak":"Zadání padlo 17. září na Beránka, Palkoviče a Hronovou. Na dalších schůzkách se to neprobíralo, takže první krok je zjistit, jak na tom jsou.","soucast":"Patří do obsahu a do propojení Premia s tištěnými tituly.","typ":"Úkol","kdo":"Beránek, Palkovič, Hronová","termin":null,"stav":"","priorita":"","zprava":"22. 9.: na schůzkách nezaznělo.","zdroj":"Úkoly 17. 9."},{"id":9,"oblast":1,"ukol":"Sepsat na jednu stránku, co do Premia patří a co ne","popis":"Krátké pravidlo pro redaktory: který článek se zamyká a který zůstává zdarma. Dnes o tom rozhoduje pocit, takže je Premium pokaždé jiné a čtenář neví, co si za své peníze kupuje.","jak":"Napsat jednu stránku srozumitelnou i pro člověka, který nastoupil včera. Vychází se z dat o tom, co lidi vede k zaplacení, viz oblast Data a měření. Je to zatím návrh ze 17. září, v zápisech ze schůzek potvrzený není.","soucast":"Patří do obsahu a souvisí se zamykáním. Bez společného pravidla se nedá poznat, jestli zamykáme dobře, nebo špatně.","typ":"Návrh","kdo":"","termin":null,"stav":"","priorita":"","zprava":"Navrženo 17. 9. s termínem 25. 9. Potvrzení v zápisech ze schůzek není.","zdroj":"Návrh 17. 9."},{"id":10,"oblast":1,"ukol":"Připravit volební seriál „Kdo řídí moje město“","popis":"Pět dílů od 5. do 9. října, všechny jen pro předplatitele, poslední v den, kdy se začíná volit. Podle dat přivádí politika nové předplatitele hlavně v době voleb. Je to krátké okno, kdy lidé informace sami hledají a jsou ochotní za ně zaplatit.","jak":"Vybrat města, rozdělit díly mezi redakce a oznámit seriál dopředu e-mailem i na titulce. Je to návrh ze 17. září, v zápisech ze schůzek zatím nepotvrzený.","soucast":"Patří do obsahu. Je to příklad toho, jak využít událost, o kterou se lidé zajímají sami od sebe.","typ":"Návrh","kdo":"","termin":"2026-10-05","stav":"","priorita":"Teď","zprava":"Navrženo 17. 9. Potvrzení v zápisech ze schůzek není.","zdroj":"Návrh 17. 9.; Rozbor 21. 9."},{"id":11,"oblast":1,"ukol":"Určit redaktory, kteří budou tváří zdraví, peněz a sportu","popis":"U každé z těchto tří rubrik má být konkrétní člověk, kterého čtenář zná jménem a kvůli kterému se vrací. Lidé si předplácejí autory, ne rubriky.","jak":"Vybrat se šéfredaktorem jména a dát jim prostor: vlastní rubriku, fotku a možnost odpovídat čtenářům.","soucast":"Patří do obsahu a souvisí s budováním značky Premia.","typ":"Úkol","kdo":"Matyáš Kaiser, Lukáš","termin":"2026-11-30","stav":"","priorita":"Pak","zprava":"","zdroj":"Plán 14. 9."},{"id":12,"oblast":1,"ukol":"Naplánovat dva seriály do Vánoc a obsah na rok 2027","popis":"Do Vánoc mají vyjít dva seriály. Ten lednový se má oznámit tři týdny dopředu, aby na něj stihla navázat kampaň. Na rok 2027 se počítá s dvanácti seriály a dvěma velkými tématy roku, která dostanou víc prostoru i podpory.","jak":"Vybrat se šéfredaktorem dvě velká témata roku a k nim rozvrhnout zbytek. Navazuje to na výběr tří nových seriálů.","soucast":"Patří do obsahu. Je to plán na příští rok, ze kterého vychází rozpočet i kampaně.","typ":"Úkol","kdo":"Matyáš Kaiser","termin":"2026-12-31","stav":"","priorita":"Pak","zprava":"14. 9.: doporučeno vybrat dvě velká témata roku. Souvisí s návrhy tří nových seriálů.","zdroj":"Plán 14. 9.; Schůzka 14. 9."},{"id":13,"oblast":2,"ukol":"U každého seriálu dopředu vědět, jak se zabalí a kde se oznámí","popis":"Ke každému seriálu má předem existovat krátký plán: jaký bude mít obal a titulek, kde se objeví upoutávka a kdy vyjde e-mail. Dnes se to řeší až ve chvíli, kdy je článek hotový, takže obsah vyjde a nikdo o něm neví.","jak":"Stačí jednoduchá tabulka na jeden seriál: titulka iDNESu, regionální titulky, doporučené články pod texty, e-mail předplatitelům, tisk a sociální sítě. Kdo to bude dělat, zatím určené není, viz oblast Lidé a role.","soucast":"Patří do marketingu. Propojuje obsahový plán s místy, kde se o Premiu dá dozvědět.","typ":"Úkol","kdo":"","termin":null,"stav":"Nezačalo","priorita":"","zprava":"22. 9.: kdo bude obsah balit a propagovat, zatím není určeno (viz Lidé a role).","zdroj":"Návrh 17. 9.; Tým 22. 9.; Vedení 22. 9."},{"id":14,"oblast":2,"ukol":"Ukazovat žebříčky nejčtenějších a nejposlouchanějších článků","popis":"Na webu se objeví seznam toho, co ostatní právě čtou a poslouchají, třeba deset nejposlouchanějších článků dne. Má to dvě výhody. Lidi zajímá, co čtou druzí, a zároveň se tak vůbec dozvědí, že se články dají poslouchat.","jak":"Sestavit žebříček z dat o čtenosti a poslechu a dát ho na viditelné místo. Probráno s týmem i s Františkem.","soucast":"Patří do propagace obsahu. Je to propagace, která nic nestojí, protože pracuje s tím, co na webu už je.","typ":"Návrh","kdo":"Jakub Strýček","termin":null,"stav":"","priorita":"","zprava":"22. 9.: probráno s týmem i s Frantou.","zdroj":"Tým 22. 9.; Vedení 22. 9."},{"id":15,"oblast":2,"ukol":"Nabídnout zprávy iDNESu v aplikaci rádia Impuls","popis":"V aplikaci Impulsu by šlo na jedno kliknutí poslechnout pět nejčtenějších zpráv iDNESu. Impuls má posluchače zvyklé poslouchat v autě, iDNES má obsah. Značka by zůstala iDNESu, takže si lidé zvyknou, že zprávy iDNESu se dají poslouchat, a nemusíme za to platit reklamu.","jak":"Jakub to chce probrat s Michalem Hanákem. Zaznělo, že zdarma by bylo jen omezené množství, třeba jeden článek nebo pět minut denně. Zatím je to nápad, ne dohoda.","soucast":"Patří do propagace obsahu a do využití toho, co vydavatelství už vlastní.","typ":"Návrh","kdo":"Jakub Strýček, Michal Hanák","termin":null,"stav":"","priorita":"","zprava":"22. 9.: nápad, Jakub ho chce probrat s Michalem. Zaznělo i omezení zdarma, třeba jeden článek nebo pět minut denně. 24. 9.: znovu s Andreou — souhrn pěti nejčtenějších článků na jedno kliknutí, v aplikaci Impulsu nebo iDNESu.","zdroj":"Vedení 22. 9.; Andrea 24. 9."},{"id":16,"oblast":2,"ukol":"Objednat reklamu pro start aplikace","popis":"Reklamní prostor se kupuje s předstihem a jeho cena se v roce mění. Plán počítal s lednem, ale na schůzce s Andreou 24. září se ukázalo, že lepší je únor: povánoční výprodeje drží zhruba do 10. února a reklama je pak levnější.","jak":"Nejdřív musí vedení rozhodnout, kdy a jak se aplikace spustí, viz oblast Aplikace. Teprve podle toho se vybere měsíc a objedná prostor. Posun z ledna na únor je potřeba potvrdit s vedením.","soucast":"Patří do marketingu a váže se na start aplikace.","typ":"Úkol","kdo":"marketing","termin":"2026-12-01","stav":"","priorita":"Počká","zprava":"24. 9.: Andrea a Jakub se shodli, že kampaň má jít v únoru, ne v lednu — povánoční výprodeje drží zhruba do 10. února a mediatypy jsou pak levnější. Termín i měsíc objednávky se tím mění, potvrdit s vedením. 2. 10.: kampaň jde na přelomu ledna a února, takže objednávka teď na řadě není. Prostor se kupuje s předstihem, proto termín 1. 12. Měsíc startu a posun z ledna potvrdit s vedením, do té doby úkol čeká.","zdroj":"Plán 14. 9.; Andrea 24. 9."},{"id":17,"oblast":2,"ukol":"Připravit kampaně podle témat","popis":"Místo jedné obecné kampaně na Premium čtyři menší: zdraví, peníze, krimi a sport. Každá mluví k jiným lidem a jde jiným kanálem. Obecná kampaň na předplatné osloví všechny a nezaujme nikoho.","jak":"Ke každému tématu vybrat obsah, který ho nejlépe ukazuje, a k němu kanál, kde ti lidé jsou. Podle plánu mají kampaně začít 1. listopadu.","soucast":"Patří do marketingu a navazuje na obsahový plán.","typ":"Úkol","kdo":"marketing","termin":"2026-11-01","stav":"","priorita":"Pak","zprava":"Podle plánu kampaně začínají 1. 11.","zdroj":"Plán 14. 9."},{"id":18,"oblast":2,"ukol":"Připravit dárkové předplatné na Vánoce","popis":"Předplatné, které někdo koupí jako dárek. Není to jen jiná cena, ale jiný produkt: kupuje ho někdo jiný, než kdo ho bude číst. Potřebuje proto vlastní stránku, vlastní důvod ke koupi a něco, co se dá dát pod stromeček.","jak":"Připravit stránku, na které se dárek koupí, a způsob, jak ho obdarovaný uplatní. Podle plánu má být hotové v polovině listopadu, aby to stihlo Vánoce.","soucast":"Patří do nabídky a ceny a zároveň do vánočních kampaní.","typ":"Úkol","kdo":"marketing, produkt","termin":"2026-11-15","stav":"","priorita":"Pak","zprava":"","zdroj":"Plán 14. 9."},{"id":19,"oblast":2,"ukol":"Vyhodnotit, co přineslo zrušení rušivé reklamy","popis":"Od 7. září nevidí předplatitelé v článcích dva nejotravnější reklamní formáty, které překrývaly text. Je to ústupek, který dům stojí peníze z reklamy, takže se musí ukázat, jestli se vyplatil.","jak":"Každý týden do konce října vzít tři čísla, nová předplatná, zrušená předplatná a stížnosti, a porovnat je s obdobím před 7. zářím. Vedení zatím říká, že změna sama o sobě nic nepřinesla. Podpořila ji čtrnáctidenní kampaň.","soucast":"Patří do marketingu a do měření. Ukáže, jestli se vyplatí kupovat si čtenáře ústupky v reklamě.","typ":"Úkol","kdo":"marketing, data","termin":"2026-10-31","stav":"","priorita":"Teď","zprava":"14. 9.: podle vedení změna zatím nic nepřinesla. 22. 9.: změnu podpořila čtrnáctidenní kampaň.","zdroj":"Plán 14. 9.; Schůzka 14. 9.; Tým 22. 9."},{"id":20,"oblast":3,"ukol":"Udělat na titulní straně iDNES.cz stálé místo pro Premium","popis":"Na titulce vznikne plocha, kde i člověk, který nic neplatí, uvidí, co je právě teď v Premiu. Dnes Premium na titulce působí jako doplněk, takže většina čtenářů neví, že existuje, ani co by za své peníze dostala. Titulní strana je pro většinu lidí vstupní brána na iDNES.","jak":"Plocha vypadá jako běžná redakční nabídka, ne jako reklama: žádné žluté orámování, jen text, že je jen pro předplatitele. Pět až šest pozic, obsah se mění jednou za den, reklamní banner nad ní zůstává. Návrhy kreslí grafici, plán počítal s dvanácti až patnácti články.","soucast":"Patří k výkladní skříni na titulce. Bez ní se o Premiu nemá kdo dozvědět, takže je to jeden ze základních kroků k cíli 200 tisíc předplatitelů.","typ":"Úkol","kdo":"Matyáš Kaiser, Luboš (šéf grafiky)","termin":"2026-10-31","stav":"V procesu","priorita":"Teď","zprava":"22. 9.: grafici prošli návrhy všech stránek. Dohodnuto: vypadá jako běžná redakční plocha, bez žlutého orámování, s textem, že je jen pro předplatitele. Pět až šest pozic, obsah se mění jednou za 24 hodin, banner nad ní zůstává. Plán počítal s 12 až 15 články.","zdroj":"Plán 14. 9.; Schůzka 14. 9.; Tým 22. 9.; Vedení 22. 9."},{"id":21,"oblast":3,"ukol":"Určit, co ve výkladní skříni bude a kdo ji každý den plní","popis":"Plocha na titulce je k ničemu, když ji nikdo denně nenaplní. Návrh je držet v ní tři věci: stálou upoutávku na seriál, hlavní téma dne a nejlepší články. Vybírat se mají podle toho, co lidi opravdu vede k zaplacení, ne podle dojmu.","jak":"Obsah vybírá Matyáš podle týdenního přehledu článků s nejvyšší konverzí, viz oblast Data a měření. Grafik upozornil, že seriál úplně nahoře není dobré místo, takže pořadí se ještě doladí.","soucast":"Patří k výkladní skříni a navazuje na obsahový plán i na data.","typ":"Úkol","kdo":"Matyáš Kaiser","termin":null,"stav":"V procesu","priorita":"","zprava":"14. 9.: plnit ji bude asi Matyáš podle dat. 22. 9.: obsah na další měsíc se připravuje. Grafik upozornil, že seriál úplně nahoře není dobré místo.","zdroj":"Schůzka 14. 9.; Tým 22. 9.; Vedení 22. 9."},{"id":22,"oblast":3,"ukol":"Zajistit Premiu místo v připravovaném novém vzhledu iDNESu","popis":"iDNES se chystá předělat. Když se o Premiu nezačne mluvit teď, vznikne nový web bez místa pro něj a bude se to předělávat znovu.","jak":"Grafici kreslí návrhy stránek. Souběžně běží úkol ověřit, že se stránky Premia nedělají dvakrát, jednou pro Premium a jednou v redesignu, viz oblast Řízení a rozhodnutí vedení.","soucast":"Patří k výkladní skříni a k novému vzhledu iDNESu.","typ":"Úkol","kdo":"Luboš (šéf grafiky)","termin":null,"stav":"V procesu","priorita":"","zprava":"22. 9.: grafici pracují na návrzích. Souvisí s úkolem ověřit, že se stránky nedělají dvakrát (Řízení).","zdroj":"Úkoly 17. 9.; Vedení 22. 9."},{"id":23,"oblast":3,"ukol":"Využít pruh nad titulkou pro obsah Premia","popis":"Úplně nahoře na titulní straně je úzký pruh, kterému se v domě říká ouško. Dnes v něm stojí pořád stejný nápis, kterého si nikdo nevšimne. Když se do něj dá obsah, který se mění, třeba upoutávka na nový díl seriálu, začne pracovat.","jak":"Rozhodnout, jestli v něm bude upoutávka na obsah, nebo se pronajme jako reklamní plocha. Na schůzce 14. září zaznělo, že má být dynamický a nést obsah. Od té doby se to neřešilo.","soucast":"Patří k výkladní skříni na titulce.","typ":"Úkol","kdo":"","termin":null,"stav":"","priorita":"","zprava":"14. 9.: ouško má být dynamické a nést obsah. 22. 9.: nezaznělo.","zdroj":"Schůzka 14. 9.; Úkoly 17. 9."},{"id":24,"oblast":3,"ukol":"Rozhodnout, kde bude Premium v hlavním menu iDNESu","popis":"V menu iDNESu má Premium stát buď na prvním, nebo na posledním místě. Mezi tím není nic, protože uprostřed menu ho nikdo nehledá. První místo říká, že je Premium pro dům důležité, poslední ho schová.","jak":"Rozhoduje vedení. Zaznělo to na schvalovací schůzce 14. září, rozhodnutí zatím nepadlo.","soucast":"Patří k tomu, jak je Premium na iDNESu vidět.","typ":"Rozhodnutí","kdo":"","termin":null,"stav":"","priorita":"","zprava":"","zdroj":"Schůzka 14. 9."},{"id":25,"oblast":3,"ukol":"Sehnat zpětnou vazbu na titulní stranu","popis":"Zadání ze 17. září znělo: Kabrna a zpětná vazba na titulku. Co přesně se má zjistit, zápis neříká.","jak":"První krok je doptat se, co bylo myšleno, a podle toho úkol upřesnit, nebo zrušit.","soucast":"Patří k titulní straně iDNESu.","typ":"Úkol","kdo":"","termin":null,"stav":"","priorita":"","zprava":"22. 9.: nezaznělo.","zdroj":"Úkoly 17. 9."},{"id":26,"oblast":4,"ukol":"Předělat stránku, na které si lidé Premium kupují","popis":"Je to poslední místo před zaplacením. Dnes se na ní čtenář nedozví, co za své peníze dostane, protože chybí výčet toho, co v Premiu je, a jednoduché vysvětlení, k čemu to je. Kdo doteď váhal, tady odejde.","jak":"Návrh už kreslí grafici, hotový má být do úterý 29. září. Stránka se udělá se současným písmem a po dokončení nového vzhledu se jen přepne, aby se na ni nečekalo.","soucast":"Patří do nabídky a ceny. Je to místo, kam vede všechno ostatní: kampaně, výkladní skříň i zamčené články.","typ":"Úkol","kdo":"produkt, Luboš (šéf grafiky)","termin":"2026-10-15","stav":"V procesu","priorita":"Teď","zprava":"22. 9.: zadaná podle Jakubova návrhu. Udělat co nejdřív, klidně se stávajícím písmem, a po dokončení nového designového systému jen přepnout. 24. 9.: návrh se kreslí, hotový má být do úterý 29. 9.","zdroj":"Plán 14. 9.; Úkoly 17. 9.; Tým 22. 9.; Andrea 24. 9."},{"id":27,"oblast":4,"ukol":"Projít vstupní stránku a stránky Premia s grafiky","popis":"Zadání ze 17. září: sejít se nad tím, jak mají stránky vypadat, aby se mohly začít kreslit.","jak":"Schůzka proběhla 22. září s Lubošem a grafiky. Jestli u toho byl Martin, zápis neuvádí.","soucast":"Patří do přípravy vstupní stránky.","typ":"Úkol","kdo":"Luboš (šéf grafiky), Martin","termin":null,"stav":"Hotovo","priorita":"","zprava":"22. 9.: vstupní stránka i stránky Premia probrané s Lubošem a grafiky. Jestli byl u toho Martin, zápis neuvádí.","zdroj":"Úkoly 17. 9.; Tým 22. 9."},{"id":28,"oblast":4,"ukol":"Postavit nabídku do tří úrovní","popis":"Čtenář má mít z čeho vybrat a kam vystoupat. První úroveň je levná a nabízí pohodlí a funkce, druhá je Premium s celým obsahem, třetí je ta nejvyšší. Co bude ve třetí, se ještě hledá: plán počítal s úrovní úplně bez reklam, na schůzce 24. září se ale ukázala lepší cesta, a to levnější předplatné pro studenty, učitele, zdravotní sestry, vojáky a policisty, kteří se prokážou průkazem.","jak":"Držitelů průkazů ISIC a ITIC je v Česku 600 tisíc, z toho 250 tisíc vysokoškoláků, takže je koho oslovit. Stránka pro ně už existuje a průkaz se uplatní přímo v košíku na počítači i v mobilu. Zbývá potvrdit s vedením, jestli tahle podoba třetí úrovně platí.","soucast":"Patří do nabídky a ceny. Tři úrovně jsou způsob, jak oslovit lidi s různou ochotou platit, aniž bychom snižovali cenu všem.","typ":"Rozhodnutí","kdo":"produkt, Lukáš","termin":"2026-10-31","stav":"V procesu","priorita":"Teď","zprava":"22. 9.: tři úrovně potvrzené. Kdyby se sdílená úroveň vyvíjela dlouho, bude zatím jiná. Plán počítal s třetí úrovní úplně bez reklam. 24. 9.: třetí úroveň se rýsuje jako oborová — studenti a učitelé s průkazem ISIC nebo ITIC, dál lékaři, hasiči a vojáci. Držitelů ISIC a ITIC je 600 tisíc, z toho 250 tisíc vysokoškoláků. Vstupní stránka pro ně je hotová a uplatnění průkazu je v košíku na počítači i v mobilu.","zdroj":"Plán 14. 9.; Tým 22. 9.; Andrea 24. 9."},{"id":29,"oblast":4,"ukol":"Nabídnout vyzkoušení Premia za korunu","popis":"Čtenář zadá kartu a první měsíc zaplatí korunu. Zdarma nefunguje tak dobře jako koruna: kdo zadá kartu, už se rozhodl to zkusit, a většinou zůstane. Vedle koruny se nemá psát plná cena, protože to vypadá, jako bychom svůj produkt shazovali.","jak":"Dohodnuto na schůzce s týmem 22. září. Zbývá to nasadit na vstupní stránce a u zamčených článků.","soucast":"Patří do nabídky a ceny. Je to hlavní způsob, jak získat nového předplatitele.","typ":"Úkol","kdo":"produkt","termin":null,"stav":"","priorita":"","zprava":"22. 9.: dohodnuto na schůzce s týmem.","zdroj":"Plán 14. 9.; Tým 22. 9."},{"id":30,"oblast":4,"ukol":"Vymyslet cestu z akční ceny na plnou","popis":"Kdo přijde na akci, nemá po měsíci skočit rovnou na plnou cenu, protože většina lidí v tu chvíli odejde. Místo skoku se cena zvedá po krocích a jako druhý krok se nabízí roční předplatné, u kterého člověk zůstane déle.","jak":"Navrhnout jednotlivé kroky a zapsat je do ceníku. Od března 2026 prodává Premium jen vlastní obsah, bez partnerských balíčků, takže nízká vstupní cena má hlavně získat platební kartu.","soucast":"Patří do nabídky a ceny a souvisí s udržením předplatitelů.","typ":"Úkol","kdo":"produkt, Lukáš","termin":"2026-10-31","stav":"","priorita":"Teď","zprava":"22. 9.: od března 2026 se prodává jen vlastní obsah. Nízká vstupní cena má hlavně získat platební kartu, cena se pak postupně zvedá.","zdroj":"Plán 14. 9.; Tým 22. 9."},{"id":31,"oblast":4,"ukol":"Zkrátit nákup ze zamčeného článku na dva kliky","popis":"Nejčastěji se lidé rozhodnou zaplatit ve chvíli, kdy narazí na zamčený článek, který chtějí dočíst. Čím víc kroků je mezi tím a zaplacením, tím víc jich odpadne.","jak":"U zamčeného článku nabídnout rovnou koupi, k tomu poslech a mezikrok za e-mail pro ty, kdo ještě platit nechtějí.","soucast":"Patří do nabídky a ceny. Propojuje zamykání obsahu s prodejem.","typ":"Úkol","kdo":"produkt, vývoj","termin":"2026-11-30","stav":"","priorita":"Pak","zprava":"","zdroj":"Plán 14. 9."},{"id":32,"oblast":4,"ukol":"Umožnit, aby pod jedním předplatným četlo víc lidí","popis":"Jeden účet a víc profilů, každý se svými uloženými články a doporučeními. Sdílení by bylo za příplatek a s limitem, kolik lidí může číst najednou. Rodina dnes buď platí víckrát, nebo si přihlašovací údaje předá a dům o tom neví.","jak":"Navrhnout, jak profily a limity fungují, a doplnit to do ceníku. Souvisí to s hledáním podoby třetí úrovně předplatného.","soucast":"Patří do nabídky a ceny.","typ":"Úkol","kdo":"produkt","termin":"2027-01-31","stav":"","priorita":"Počká","zprava":"22. 9.: souvisí se sdílenou třetí úrovní předplatného.","zdroj":"Plán 14. 9.; Tým 22. 9."},{"id":33,"oblast":5,"ukol":"Sepsat seznam funkcí Premia a pořadí, v jakém se budou přidávat","popis":"Přehled všeho, co Premium může na webu nabídnout navíc: ukládání článků, poslech, shrnutí, sledování autorů, diskuse a další. U každé funkce je napsané, jestli bude volná pro všechny, s limitem pro registrované, nebo jen pro předplatitele. Bez takového seznamu se funkce přidávají náhodně a nikdo neví, co má být dřív.","jak":"Andrea seznam sepsala a rozdělila do čtyř fází, soubor Features pro Premium. Slouží teď jako podklad pro grafiky i pro vývoj.","soucast":"Patří ke stránkám a funkcím Premia. Je to výchozí seznam, ze kterého vychází většina ostatních úkolů v téhle oblasti.","typ":"Úkol","kdo":"Andrea","termin":null,"stav":"Hotovo","priorita":"","zprava":"22. 9.: Andrea sepsala funkce ve čtyřech fázích (soubor Features pro Premium). U každé je, jestli bude volná, s limitem, nebo jen pro Premium.","zdroj":"Úkoly 17. 9.; Funkce 22. 9.; Vedení 22. 9."},{"id":34,"oblast":5,"ukol":"Sjednotit tlačítka u článků, aby bylo jasné, co je zdarma a co za předplatné","popis":"U článků na iDNESu jsou tlačítka jako poslech, uložení nebo shrnutí. Dnes z nich čtenář nepozná, jestli je může použít: někde svítí zlaté „i“, jinde nic. Nově budou pravidla stejná na celém webu. Kdo není přihlášený, tlačítko vidí, ale nepoužije. Kdo se zaregistruje, dostane ho s limitem. Kdo platí, používá ho bez omezení. Čtenář tak pořád vidí, co by mohl mít, a ví, co pro to musí udělat.","jak":"Grafici nakreslí tlačítko ve třech podobách a k němu popisek, který ukazuje, kolik z limitu zbývá, například „poslech 1 ze 3“. Zlaté „i“ nahradí zámek. Grafici úkol přijali 22. září.","soucast":"Patří ke stránkám a funkcím Premia. Je to způsob, jak čtenáři ukázat, co si za předplatné kupuje, aniž by ho někdo musel přesvědčovat.","typ":"Úkol","kdo":"Luboš (šéf grafiky)","termin":null,"stav":"Nezačalo","priorita":"","zprava":"22. 9.: grafici úkol přijali.","zdroj":"Tým 22. 9.; Vedení 22. 9."},{"id":35,"oblast":5,"ukol":"Ověřit, že stejná tlačítka půjdou použít i v diskusích a fórech","popis":"Aby se čtenář neučil pravidla dvakrát, musí tlačítka fungovat všude stejně: v článku, v diskusi pod ním i ve fórech. Jinak vznikne zase zmatek, který se teď snažíme odstranit.","jak":"Lukáš pošle své návrhy pro fóra a porovnají se s návrhem tlačítek u článků.","soucast":"Patří ke stránkám a funkcím Premia a navazuje na sjednocení tlačítek.","typ":"Úkol","kdo":"Lukáš","termin":null,"stav":"Nezačalo","priorita":"","zprava":"22. 9.: Luky pošle své návrhy pro fóra.","zdroj":"Tým 22. 9."},{"id":36,"oblast":5,"ukol":"Překreslit stránku s článkem, aby se do ní funkce Premia vešly","popis":"Stránka článku je dnes plná a nové funkce, jako poslech nebo shrnutí, na ní nemají kam. Nové rozvržení jim udělá místo a dá je tam, kde je čtenář čeká. Například zvětšení písma patří nahoru k nadpisu.","jak":"Kreslí grafici, kteří se k tomu dostanou nejdřív za tři týdny, na schůzce s týmem zaznělo za měsíc až šest týdnů, protože souběžně běží obnova iDNESu. Technicky se na funkcích může pracovat už teď.","soucast":"Patří ke stránkám a funkcím Premia. Je to místo, kde předplatitel většinu funkcí uvidí.","typ":"Úkol","kdo":"Luboš (šéf grafiky)","termin":null,"stav":"Nezačalo","priorita":"","zprava":"22. 9.: grafik se k němu dostane nejdřív za tři týdny, na schůzce s týmem zaznělo za měsíc až šest týdnů, kvůli refreshi iDNESu. Na funkcích se technicky pracovat může.","zdroj":"Tým 22. 9.; Vedení 22. 9."},{"id":37,"oblast":5,"ukol":"Srovnat stránku Premia a přenést do iDNESu všechny články","popis":"Stránka, kterou vidí předplatitel. Dnes nemá řád, protože část článků na iDNESu vůbec není a leží jinde. Dokud nejsou všechny na jednom místě, nedá se stránka pořádně poskládat ani měřit.","jak":"Přenos obsahu do redakčního systému JIS je zadaný. Až bude hotový, dá se stránka postavit.","soucast":"Patří ke stránkám a funkcím Premia.","typ":"Úkol","kdo":"","termin":null,"stav":"V procesu","priorita":"","zprava":"22. 9.: přenos obsahu do JISu je zadaný.","zdroj":"Úkoly 17. 9.; Tým 22. 9."},{"id":38,"oblast":5,"ukol":"Postavit vlastní titulní stránku Premia","popis":"Titulka jen pro předplatitele, kde vidí všechno, co si zaplatili. Staví se až po vstupní stránce a výkladní skříni, protože ty přivádějí nové lidi, zatímco tahle slouží těm, které už máme.","jak":"Grafik chystá návrh vzhledu všech stránek Premia včetně této.","soucast":"Patří ke stránkám a funkcím Premia.","typ":"Úkol","kdo":"Luboš (šéf grafiky)","termin":null,"stav":"V procesu","priorita":"","zprava":"22. 9.: grafik chystá návrh vzhledu všech stránek včetně této.","zdroj":"Tým 22. 9.; Vedení 22. 9."},{"id":39,"oblast":5,"ukol":"Udělat stránku Připravujeme s obsahem, který teprve vyjde","popis":"Stránka, kde čtenář uvidí, co se chystá, s odpočtem a tlačítkem, kterým si nechá start připomenout. Čtenář má důvod se vracet a marketing má co oznamovat dopředu.","jak":"Zadání je sepsané, stránka se má vyrobit. Podle plánu má být hotová 12. října.","soucast":"Patří ke stránkám a funkcím Premia a navazuje na obsahový plán.","typ":"Úkol","kdo":"produkt","termin":"2026-10-12","stav":"V procesu","priorita":"Teď","zprava":"22. 9.: zadání je sepsané, aby se vyrobila.","zdroj":"Plán 14. 9.; Vedení 22. 9."},{"id":40,"oblast":5,"ukol":"Nabízet pod článkem další texty od stejného autora nebo o stejném člověku","popis":"Když někoho text zaujme, nejjednodušší je nabídnout mu hned další podobný. Čte pak víc a spíš u Premia zůstane.","jak":"Napojit doporučení na autora a na osobu, o které článek je. Na schůzkách 22. září se to neprobíralo.","soucast":"Patří ke stránkám a funkcím Premia a souvisí s udržením předplatitelů.","typ":"Úkol","kdo":"","termin":null,"stav":"","priorita":"","zprava":"22. 9.: nezaznělo.","zdroj":"Úkoly 17. 9."},{"id":41,"oblast":5,"ukol":"Umožnit předplatitelům sledovat autora nebo téma","popis":"Čtenář si u oblíbeného autora nebo tématu klikne na sledovat a dostane upozornění, když vyjde nový text. Tlačítko vidí všichni, funguje jen předplatitelům, takže i ten, kdo neplatí, vidí, co by mohl mít. Na iDNESu dnes tahle funkce není.","jak":"V aplikaci to bude až ve druhé verzi, v první není zaplacené. Na webu zatím není rozhodnuté kdy.","soucast":"Patří ke stránkám a funkcím Premia.","typ":"Návrh","kdo":"","termin":null,"stav":"","priorita":"","zprava":"22. 9.: na iDNESu dnes tato funkce není. 24. 9.: v aplikaci až ve druhé verzi, v první není zaplacená.","zdroj":"Funkce 22. 9.; Tým 22. 9.; Andrea 24. 9."},{"id":42,"oblast":5,"ukol":"Nabídnout shrnutí článku do pěti bodů","popis":"Krátké shrnutí na začátku textu pro toho, kdo nemá čas číst celý článek. Neplatící uvidí první bod, zbytek se odemkne po zaplacení, takže funguje i jako ukázka.","jak":"Technicky je funkce hotová. Zbývá rozhodnout, kde a jak se ukáže.","soucast":"Patří ke stránkám a funkcím Premia.","typ":"Návrh","kdo":"","termin":null,"stav":"","priorita":"","zprava":"22. 9.: technicky hotové.","zdroj":"Funkce 22. 9.; Tým 22. 9."},{"id":43,"oblast":5,"ukol":"Posílat shrnutí dne třikrát denně","popis":"Dopoledne, odpoledne a v noci krátký přehled článků, které by předplatitel neměl minout. Je to služba pro lidi, kteří nemají čas hlídat zprávy celý den, a zároveň důvod, proč se vracet.","jak":"Sestavit přehled z toho, co za dané období vyšlo, a nabídnout ho jen předplatitelům.","soucast":"Patří ke stránkám a funkcím Premia a souvisí s udržením předplatitelů.","typ":"Návrh","kdo":"","termin":null,"stav":"","priorita":"","zprava":"","zdroj":"Funkce 22. 9.; Tým 22. 9."},{"id":44,"oblast":5,"ukol":"Zprovoznit poslech článků","popis":"Článek jde pustit jako zvuk, třeba v autě nebo při vaření. Předplatitel má nahlas všechny, ostatní jeden denně nebo ukázku, aby poznali, co jim uniká.","jak":"Podle plánu má být do 30. listopadu hotové zadání. Dnes poslech na webu není.","soucast":"Patří ke stránkám a funkcím Premia. Je to zároveň obsah pro spolupráci s rádiem Impuls.","typ":"Úkol","kdo":"produkt, vývoj","termin":"2026-11-30","stav":"","priorita":"Pak","zprava":"22. 9.: poslech zatím není hotový. Do 30. 11. má být zadání podle plánu.","zdroj":"Plán 14. 9.; Funkce 22. 9.; Tým 22. 9."},{"id":45,"oblast":5,"ukol":"Dostat noviny a časopisy do Premia jako běžné články","popis":"Dnes se noviny nabízejí jako PDF, do kterého skoro nikdo nechodí. Když z nich budou běžné články na webu, čte je člověk stejně pohodlně jako zbytek iDNESu. Tým to označil za nejdůležitější a zároveň nejtěžší funkci.","jak":"Rozhodnout, jak se texty z vydání převedou a jak se budou v Premiu řadit. Souvisí to s převodem textů z novin, viz oblast Obsah.","soucast":"Patří ke stránkám a funkcím Premia. Je to hlavní věc, kterou může Premium nabídnout navíc proti běžnému iDNESu.","typ":"Úkol","kdo":"","termin":null,"stav":"","priorita":"","zprava":"22. 9.: tým ho označil za nejdůležitější a nejtěžší funkci.","zdroj":"Plán 14. 9.; Funkce 22. 9.; Tým 22. 9."},{"id":46,"oblast":5,"ukol":"Omezit, kolik odemčených článků může předplatitel rozeslat","popis":"Předplatitel dnes může poslat odemčený článek komukoli a bez omezení. Jeden takový odkaz si přečte až kolem pěti set lidí, kteří tím pádem nemají důvod platit. Návrh je nechat deset článků měsíčně, jako to mají Hospodářské noviny.","jak":"Nastavit měsíční limit a ukázat ho v účtu, aby to nepůsobilo jako trest, ale jako výhoda předplatitele.","soucast":"Patří ke stránkám a funkcím Premia a souvisí se zamykáním obsahu.","typ":"Návrh","kdo":"","termin":null,"stav":"","priorita":"","zprava":"","zdroj":"Funkce 22. 9.; Tým 22. 9."},{"id":47,"oblast":5,"ukol":"Rozhodnout, jestli ukládání článků bude jen pro předplatitele","popis":"Uložení článku na později je běžná funkce, ale za loňský rok ji použilo 11 tisíc lidí ze čtyř milionů měsíčně. Na schůzce proto zaznělo, jestli má vůbec smysl ji zamykat, když ji skoro nikdo nepoužívá.","jak":"Porovnat, kolik lidí ji používá, s tím, kolik by jich kvůli ní zaplatilo, a podle toho rozhodnout.","soucast":"Patří ke stránkám a funkcím Premia.","typ":"Návrh","kdo":"","termin":null,"stav":"","priorita":"","zprava":"22. 9.: zazněla pochybnost, jestli má smysl ji zamykat.","zdroj":"Funkce 22. 9.; Tým 22. 9."},{"id":48,"oblast":5,"ukol":"Zbavit předplatitele nejotravnějších reklam","popis":"Předplatitelé už nevidí dva reklamní formáty, které překrývaly text. Běžná reklama zůstává, protože Premium se platí za obsah, ne za to, že chybí reklama.","jak":"Spuštěno 7. září a podpořeno čtrnáctidenní kampaní. Co to přineslo, se vyhodnocuje, viz oblast Marketing a propagace obsahu.","soucast":"Patří ke stránkám a funkcím Premia.","typ":"Úkol","kdo":"","termin":null,"stav":"Hotovo","priorita":"","zprava":"22. 9.: spuštěno, podpořeno čtrnáctidenní kampaní. 24. 9.: vyhozené jsou dva nejvíc obtěžující formáty, které překrývaly text.","zdroj":"Schůzka 14. 9.; Funkce 22. 9.; Tým 22. 9.; Andrea 24. 9."},{"id":49,"oblast":5,"ukol":"Rozhodnout, jestli zrušit vlastní pořadí rubrik na titulce","popis":"Čtenář si dnes může přeskládat rubriky na titulní straně. Používá to asi půl procenta lidí, přitom funkci musí někdo udržovat a počítat s ní při každé změně webu.","jak":"Na schůzce 22. září převažoval názor funkci zrušit. Zbývá to potvrdit a naplánovat.","soucast":"Patří ke stránkám a funkcím Premia. Je to příklad úklidu: čím míň funkcí, které nikdo nepoužívá, tím víc času na ty, které lidé chtějí.","typ":"Rozhodnutí","kdo":"","termin":null,"stav":"","priorita":"","zprava":"22. 9.: převažuje názor funkci zrušit.","zdroj":"Tým 22. 9."},{"id":50,"oblast":5,"ukol":"Umožnit stáhnout si články na cestu bez signálu","popis":"Články se stáhnou dopředu a dají se číst ve vlaku nebo v metru, kde není signál. Zaznělo ale, že tohle dnes umí i samotné prohlížeče, takže přínos nemusí být velký.","jak":"Plán funkci řadí do druhé verze aplikace. Nejdřív je potřeba ověřit, jestli ji lidé opravdu chtějí.","soucast":"Patří ke stránkám a funkcím Premia a k aplikaci.","typ":"Návrh","kdo":"vývoj","termin":null,"stav":"","priorita":"","zprava":"22. 9.: zatím není. Zaznělo, že prohlížeče to dnes umí samy. Plán ho řadí do druhé verze aplikace.","zdroj":"Plán 14. 9.; Funkce 22. 9.; Tým 22. 9."},{"id":51,"oblast":5,"ukol":"Zjistit, co se má vylepšit na Marvinovi","popis":"Zadání ze 17. září znělo dodat vylepšení Marvina a ukázat, co bychom potřebovali doplnit. Co Marvin je, žádný z podkladů nevysvětluje, takže se úkol zatím nedá udělat.","jak":"První krok je doptat se, co Marvin je a co se od vylepšení čeká.","soucast":"Patří ke stránkám a funkcím Premia.","typ":"Úkol","kdo":"","termin":null,"stav":"","priorita":"","zprava":"22. 9.: nezaznělo.","zdroj":"Úkoly 17. 9."},{"id":52,"oblast":6,"ukol":"Rozhodnout, jestli dáme registrovaným čtenářům část obsahu zdarma","popis":"Freemium znamená, že člověk, který nám nechá e-mail a zaregistruje se, dostane něco zdarma, třeba tři zamčené články, a teprve potom narazí na nabídku předplatného. Získáme kontakt, kterému můžeme psát, a čtenář si stihne zvyknout na to, co si kupuje. Zároveň tím ale část obsahu rozdáváme. Proto je to rozhodnutí vedení, ne úkol pro jednoho člověka.","jak":"Vybrat z dvou cest: buď dát zdarma několik článků s odpočtem, nebo nechat obsah zamčený a zdarma pouštět jen funkce. Ať padne cokoli, znamená to zásah do webu i do aplikace, takže rozhodnutí musí přijít dřív, než se začne programovat. Otevřené je i pořadí, jestli nejdřív freemium, nebo zamykání funkcí.","soucast":"Patří k zamykání obsahu. Je to jedna ze dvou hlavních pák, kterými se dá ovlivnit, kolik lidí nakonec zaplatí.","typ":"Rozhodnutí","kdo":"","termin":null,"stav":"V procesu","priorita":"","zprava":"22. 9.: nerozhodnuto. Otevřené je i pořadí, jestli nejdřív freemium, nebo zamykání funkcí.","zdroj":"Funkce 22. 9.; Tým 22. 9."},{"id":53,"oblast":6,"ukol":"Zamykat to, co podle dat přivádí předplatitele","popis":"Zamykat se mají hlavně témata, u kterých data ukazují, že kvůli nim lidé platí: krimi, politika, zdraví a peníze. Agenturní zprávy, které má každý web stejné, se nezamykají nikdy, protože si je čtenář přečte jinde zdarma.","jak":"Šéfredaktor a lidé od dat si pravidelně projdou, co přivedlo nové předplatitele, a podle toho upraví, co se zamyká. Dnes je zamčených asi 600 článků měsíčně, dřív jich bylo 1 100 až 1 200, hlavně proto, že Lidovky přestaly být prémiové.","soucast":"Patří do zamykání obsahu. Zamykat správně je levnější než vyrábět nový obsah.","typ":"Úkol","kdo":"Matyáš Kaiser, data","termin":"2026-10-15","stav":"","priorita":"Teď","zprava":"14. 9.: zprávy se zamykají dál, ale podle dat. 22. 9.: zamčených článků je kolem 600 měsíčně, dřív 1 100–1 200, hlavně proto, že Lidovky přestaly být prémiové.","zdroj":"Plán 14. 9.; Schůzka 14. 9.; Tým 22. 9."},{"id":54,"oblast":6,"ukol":"Napovědět redaktorovi přímo v systému, jestli článek zamknout","popis":"Aby se pravidlo z dat opravdu používalo, musí být na místě, kde redaktor článek ukládá. Rada se ukáže rovnou tam, takže nikdo nemusí nic hledat v dokumentech.","jak":"Nejdřív musí vzniknout pravidlo z dat a pak se doplní do redakčního systému. Tým to má jako dlouhodobý cíl.","soucast":"Patří do zamykání obsahu a navazuje na standard Premia.","typ":"Úkol","kdo":"data, Matyáš Kaiser","termin":"2026-10-31","stav":"","priorita":"Teď","zprava":"22. 9.: tým to má jako dlouhodobý cíl.","zdroj":"Plán 14. 9.; Tým 22. 9."},{"id":55,"oblast":6,"ukol":"Vyzkoušet zamykání fotogalerií","popis":"Galerie mají ze všeho nejvíc zobrazení, takže je to velká plocha, kde se dá zkusit prodej. Návrh je ukázat část snímků volně a zbytek nabídnout za předplatné. Hned po odemčení je potřeba nabídnout něco dalšího, jinak čtenář odejde.","jak":"Kroky jsou navržené: zjistit výkon galerií, stanovit pravidlo, co přijde po odemčení, vybrat, kde se to zkusí, určit, jak se to změří, a nakonec rozhodnout. Navrženo 17. září s termíny 29. září a 2. října, na schůzkách 22. září se to neprobíralo.","soucast":"Patří do zamykání obsahu.","typ":"Úkol","kdo":"","termin":null,"stav":"","priorita":"","zprava":"17. 9.: kroky navržené s termíny 29. 9. a 2. 10. 22. 9.: nezaznělo.","zdroj":"Úkoly 17. 9.; Návrh 17. 9."},{"id":56,"oblast":6,"ukol":"Vyzkoušet prodej na jedné úzké sekci, například na TechNetu","popis":"Než se něco pustí na celý web, vyzkouší se to na jedné menší rubrice. Když to nevyjde, nic velkého se nestane, a když ano, ví se, co pustit dál. Vedení váhalo kvůli tomu, že TechNet má specifické čtenáře.","jak":"Vybrat sekci, nabídnout v ní prémiový obsah a změřit, kolik lidí zaplatí. Jakub navrhl vyzkoušet tam i zamykání funkcí.","soucast":"Patří do zamykání obsahu a do měření.","typ":"Úkol","kdo":"data, Matyáš Kaiser","termin":"2026-11-30","stav":"","priorita":"Pak","zprava":"14. 9.: Jakub navrhl TechNet, vedení váhalo kvůli specifické cílové skupině. 22. 9.: Jakub navrhl zkusit tam i zamykání funkcí.","zdroj":"Plán 14. 9.; Schůzka 14. 9.; Tým 22. 9."},{"id":57,"oblast":7,"ukol":"Zjistit, jak z diskusí získat registrace a předplatitele","popis":"Rozbor toho, jak s diskusemi pracují jinde, a návrh postupu ve čtyřech stupních: nepřihlášený vidí jen náhled, registrovaný píše s denním limitem, předplatitel bez limitu a s označením, a u zamčených článků může debatovat s autorem. Diskuse dělají podle týmu desetinu všech zobrazení stránek, takže je to velký a zatím nevyužitý prostor.","jak":"Vznikl dokument s výzkumem a návrhem, představený týmu i vedení 22. září.","soucast":"Patří do diskusí. Je to podklad pro rozhodnutí, jestli se do toho pustíme.","typ":"Úkol","kdo":"Jakub Strýček","termin":"2026-09-21","stav":"Hotovo","priorita":"","zprava":"22. 9.: představeno týmu i vedení.","zdroj":"Úkoly 17. 9.; Výzkum 21. 9.; Tým 22. 9.; Vedení 22. 9."},{"id":58,"oblast":7,"ukol":"Poslat Michalovi prezentaci o diskusích","popis":"Michal Hanák chtěl výzkum i návrh vidět písemně. Stačilo mu to do pátku.","jak":"Odesláno.","soucast":"Patří do diskusí.","typ":"Úkol","kdo":"Jakub Strýček","termin":"2026-09-25","stav":"Hotovo","priorita":"","zprava":"22. 9.: Michalovi stačí v pátek.","zdroj":"Vedení 22. 9."},{"id":59,"oblast":7,"ukol":"Probrat diskuse s týmem jako samostatné téma","popis":"Na schůzce 22. září se diskuse jen zmínily. Návrh je vrátit se k nim zvlášť a dohodnout, jestli se postup po stupních vyzkouší.","jak":"Jakub navrhl vrátit se k tomu příští týden.","soucast":"Patří do diskusí.","typ":"Návrh","kdo":"Jakub Strýček","termin":null,"stav":"","priorita":"","zprava":"22. 9.: Jakub navrhl vrátit se k tomu příští týden.","zdroj":"Tým 22. 9."},{"id":60,"oblast":7,"ukol":"Sehnat z domu čísla o diskusích","popis":"Bez čísel se nedá spočítat, co která varianta získá a co ztratí. Potřebujeme vědět, kolik lidí diskutuje a kolik z nich platí, kolik příspěvků denně přibývá, kolik stojí moderace a kolik zobrazení stránek diskuse dělají.","jak":"Vyžádat si údaje od lidí od dat. Zatím víme jen to, že diskuse podle týmu dělají deset procent zobrazení stránek.","soucast":"Patří do diskusí a do měření.","typ":"Úkol","kdo":"","termin":null,"stav":"","priorita":"","zprava":"22. 9.: diskuse podle týmu dělají deset procent všech zobrazení stránek.","zdroj":"Výzkum 21. 9.; Tým 22. 9."},{"id":61,"oblast":7,"ukol":"Vyzkoušet nový postup ve dvou regionálních rubrikách","popis":"Nová pravidla se pustí ve dvou regionech a porovnají se se dvěma, kde se nic nemění. Po šesti až osmi týdnech je vidět, jestli to funguje, a nemusí se to hned pouštět na celý web.","jak":"Vybrat čtyři srovnatelné regiony, dva z nich přepnout a měřit registrace a předplatné.","soucast":"Patří do diskusí.","typ":"Návrh","kdo":"","termin":null,"stav":"","priorita":"","zprava":"","zdroj":"Výzkum 21. 9."},{"id":62,"oblast":7,"ukol":"Nabídnout shrnutí dlouhé diskuse jako funkci Premia","popis":"Pod článkem se sejdou stovky příspěvků a nikdo je nepřečte. Krátké shrnutí ukáže, na čem se lidé shodli a kde se rozcházejí. Dá se to nabízet jako nezávislý pohled na debatu.","jak":"Tým funkci vede v seznamu funkcí Premia. Zbývá rozhodnout, kdy se udělá.","soucast":"Patří do diskusí a mezi funkce Premia.","typ":"Návrh","kdo":"","termin":null,"stav":"","priorita":"","zprava":"22. 9.: tým ho má v seznamu funkcí.","zdroj":"Funkce 22. 9.; Tým 22. 9."},{"id":63,"oblast":8,"ukol":"Rozhodnout, jak se nová aplikace spustí","popis":"Návrh je nechat novému uživateli deset stránek zdarma, pak ho požádat o registraci a nabídnout vyzkoušení Premia za korunu s uloženou kartou. Na tomhle rozhodnutí visí objednávka reklamy, protože podle něj se pozná, kolik lidí a kdy má kampaň přivést.","jak":"Rozhoduje Michal Hanák s produktem. Termín podle plánu je konec září.","soucast":"Patří k aplikaci. Je to jedno z rozhodnutí, která mají padnout do konce září.","typ":"Rozhodnutí","kdo":"Michal Hanák, produkt","termin":"2026-10-15","stav":"","priorita":"Teď","zprava":"2. 10.: termín 30. 9. prošel. Na tomhle rozhodnutí visí objednávka reklamy i celá kampaň, proto nový termín 15. 10.","zdroj":"Plán 14. 9."},{"id":64,"oblast":8,"ukol":"Rozhodnout, jestli bude rubrika Pro mě jen pro předplatitele","popis":"Pro mě je část aplikace, kde si čtenář skládá vlastní výběr článků. Buď bude celá za předplatné a stane se z ní důvod platit, nebo zůstane otevřená a bude přitahovat nové lidi. Obojí zároveň nejde.","jak":"Rozhodnutí zatím nepadlo a podle týmu se nedá dlouho odkládat, protože se podle něj kreslí aplikace.","soucast":"Patří k aplikaci a k zamykání obsahu.","typ":"Rozhodnutí","kdo":"","termin":null,"stav":"","priorita":"","zprava":"22. 9.: nerozhodnuto, dlouho odkládat nejde.","zdroj":"Tým 22. 9."},{"id":65,"oblast":8,"ukol":"Spustit novou aplikaci iDNES","popis":"V prosinci ji dostanou lidé z domu, aby se chyby našly dřív než u čtenářů, v lednu 2027 se pustí veřejně. Termín drží kapacita agentury: Uplifting má na aplikaci vyhrazený čas do konce ledna a účtuje odpracované hodiny, takže každá funkce navíc znamená buď vícenáklady, nebo že jiná vypadne.","jak":"Programuje se v jazyce Kotlin. Titulní stránka je skoro hotová, řeší se sport, v dalším vydání přibude vyhledávání, záložky a velikost písma. Chystá se test mezi čtenáři s dotazníkem. Jakub má pozvánku do testovacího prostředí, takže aplikaci sleduje průběžně.","soucast":"Patří k aplikaci.","typ":"Úkol","kdo":"produkt, Andrea","termin":"2027-01-31","stav":"V procesu","priorita":"Pak","zprava":"22. 9.: Andrea na aplikaci pracuje. 24. 9.: programuje se v Kotlinu s agenturou Uplifting, která má kapacitu zarezervovanou do konce ledna a účtuje čas a práci — každá funkce navíc znamená buď vícenáklady, nebo že jiná vypadne. Titulní stránka je skoro hotová, řeší se sport, v dalším vydání přibude vyhledávání, záložky a velikost písma. Chystá se test mezi čtenáři s dotazníkem. Jakub má pozvánku do testovacího prostředí. 2. 10.: doplněn termín podle plánu — v prosinci aplikaci dostanou lidé z domu, veřejně se spouští v lednu 2027.","zdroj":"Plán 14. 9.; Vedení 22. 9.; Andrea 24. 9."},{"id":66,"oblast":8,"ukol":"Připravit do aplikace první funkce jen pro předplatitele","popis":"Do první verze patří Pro mě, uložené články, souhrn dne a upozornění. Jsou to věci, které dávají důvod aplikaci otevřít i ve chvíli, kdy člověk nic konkrétního nehledá.","jak":"Termín podle plánu je konec roku. Co se do první verze vejde, se dohodne na schůzce k funkcím 1. října.","soucast":"Patří k aplikaci a navazuje na seznam funkcí Premia.","typ":"Úkol","kdo":"produkt, vývoj","termin":"2026-12-31","stav":"","priorita":"Pak","zprava":"","zdroj":"Plán 14. 9."},{"id":67,"oblast":8,"ukol":"Po třech měsících vyhodnotit, co aplikace přinesla","popis":"Kolik lidí si ji stáhlo, kolik z nich zaplatilo a kolik zůstalo. Podle toho se rozhodne o druhé vlně kampaně.","jak":"Sledovat tři čísla od spuštění a po devadesáti dnech je porovnat s tím, co se čekalo. Termín podle plánu je konec dubna 2027.","soucast":"Patří k aplikaci a k měření.","typ":"Úkol","kdo":"produkt, data","termin":"2027-04-30","stav":"","priorita":"Počká","zprava":"","zdroj":"Plán 14. 9."},{"id":68,"oblast":9,"ukol":"Změřit, kolik předplatitelů doopravdy odchází","popis":"Kolik lidí každý měsíc odejde, podle toho, kdy a za jakou cenu přišli. Za rok 2025 jich odešlo 28 tisíc, ale průběžně se to neměří. Na tomhle čísle stojí celý model plánu: bez něj se nedá spočítat, kolik nových předplatitelů je potřeba, aby počet vůbec rostl.","jak":"Lidé od dat sestaví pravidelný přehled odchodů. Termín podle plánu je konec září.","soucast":"Patří do udržení předplatitelů a je to vstup pro celý plán k 200 tisícům.","typ":"Úkol","kdo":"data","termin":"2026-10-31","stav":"","priorita":"Teď","zprava":"2. 10.: termín 30. 9. prošel, posunuto na konec října.","zdroj":"Plán 14. 9."},{"id":69,"oblast":9,"ukol":"Doplnit ke čtenáři údaje, podle kterých se pozná, že odchází","popis":"Karta čtenáře je přehled, který o člověku máme. Dnes ukazuje jen účet, datum registrace, typ předplatného, způsob platby a poslední objednávku, ale ne to, co čte. Proto nepoznáme, že přestal chodit, dokud nezruší platbu.","jak":"Doplnit, co člověka zajímá za 7, 30 a 90 dní, tři nejnavštěvovanější sekce, poměr placeného a neplaceného čtení, kolísání zájmu, historii předplatných, hodnotu za posledních 12 měsíců a cesty, kterými se dostal k zaplacení. Dnes se to skládá ručně asi z pěti systémů a zabere to celý den. Andrea podklad pošle znovu e-mailem.","soucast":"Patří do udržení předplatitelů. Je to podklad pro datový přehled, viz oblast Data a měření.","typ":"Úkol","kdo":"Andrea","termin":null,"stav":"V procesu","priorita":"","zprava":"22. 9.: Andrea sepsala, co je potřeba doplnit. 24. 9.: dnešní karta ukazuje jen účet, datum registrace, typ předplatného, způsob platby a poslední objednávku — ne to, co člověk čte. Doplnit ostrovy zájmu za 7, 30 a 90 dní, tři nejnavštěvovanější sekce, poměr placeného a neplaceného čtení, index fluktuace, historii cyklů, hodnotu za 12 měsíců a cesty ke konverzi. Dnes se to skládá ručně asi z pěti systémů, práce na celý den. Andrea pošle podklad znovu e-mailem.","zdroj":"Tým 22. 9.; Andrea 24. 9."},{"id":70,"oblast":9,"ukol":"Zjistit, jak dlouho lidé zůstávají podle obsahu, kvůli kterému zaplatili","popis":"Kdo zaplatil kvůli krimi, zůstává jinak dlouho než ten, kdo přišel kvůli zdraví. Když to víme, dá se rozhodnout, jaký obsah se vyplatí vyrábět, i kdyby mu samotná návštěvnost neodpovídala.","jak":"Rozdělit předplatitele podle článku, na kterém zaplatili, a sledovat, jak dlouho vydrží, kolik času čtením stráví a jaký mají poměr placeného a volného čtení.","soucast":"Patří do udržení předplatitelů a do měření.","typ":"Úkol","kdo":"data, vývoj","termin":"2026-10-31","stav":"","priorita":"Teď","zprava":"","zdroj":"Plán 14. 9."},{"id":71,"oblast":9,"ukol":"Postarat se o předplatitele během prvního měsíce","popis":"Člověk zaplatí kvůli jednomu článku a než vyjde další, který ho zajímá, zapomene, proč platí. První měsíc rozhoduje, jestli zůstane. Pomáhají e-maily psané lidsky, newsletter k seriálu a upozornění na nový díl.","jak":"Připravit sérii zpráv na prvních 30 dní: co přijde hned po zaplacení, co za týden a co před koncem měsíce.","soucast":"Patří do udržení předplatitelů.","typ":"Úkol","kdo":"marketing, produkt","termin":"2026-10-31","stav":"","priorita":"Teď","zprava":"","zdroj":"Plán 14. 9."},{"id":72,"oblast":9,"ukol":"Nabídnout důvod zůstat tomu, kdo chce odejít","popis":"Kdo dnes chce odejít, pošle SMS se slovem STOP a nikdo mu nic nenabídne. Přitom právě tohle je nejlevnější příležitost si člověka udržet.","jak":"Že to funguje, už je vidět: nabídka bez rušivých reklam šla 2 500 lidem, kteří zrušili platbu, a asi 500 z nich zůstalo na ročním předplatném. Zbývá z toho udělat běžný postup, ne jednorázovou akci.","soucast":"Patří do udržení předplatitelů.","typ":"Úkol","kdo":"produkt","termin":"2026-10-31","stav":"","priorita":"Teď","zprava":"24. 9.: první důkaz, že to funguje — nabídka bez rušivých reklam šla na 2 500 lidí, kteří zrušili platbu, a asi 500 z nich zůstalo na ročním předplatném.","zdroj":"Plán 14. 9.; Andrea 24. 9."},{"id":73,"oblast":9,"ukol":"Poslat před obnovením předplatného připomínku, co člověk přečetl","popis":"Krátká zpráva před stržením platby: kolik článků jste přečetli a že čtete víc než většina ostatních. Připomene hodnotu právě ve chvíli, kdy se člověk rozhoduje, jestli platit dál.","jak":"Tým ho plánuje. Potřebuje k tomu údaje o čtení z karty čtenáře.","soucast":"Patří do udržení předplatitelů.","typ":"Úkol","kdo":"","termin":null,"stav":"","priorita":"","zprava":"22. 9.: tým ho plánuje.","zdroj":"Tým 22. 9."},{"id":74,"oblast":9,"ukol":"Doporučovat čtenáři další články, které ho udrží","popis":"Jeden článek člověka přivede, ale musí ho zaujmout další tři, jinak odejde. Doporučení se mají trefit do toho, co ho zajímá, ne nabízet náhodné texty.","jak":"Zadání do konce listopadu, v aplikaci do konce února 2027. Do té doby se bude doporučovat podle klíčových slov u článku.","soucast":"Patří do udržení předplatitelů.","typ":"Úkol","kdo":"data, produkt","termin":"2026-11-30","stav":"","priorita":"Pak","zprava":"","zdroj":"Plán 14. 9."},{"id":75,"oblast":10,"ukol":"Sjednotit čísla mezi výzkumem a marketingem","popis":"Andrea má data za tři roky, Petr Kelin za rok a čísla se liší. Dokud všichni nečtou stejná data stejně, nedá se podle nich rozhodovat.","jak":"Sejít se s oběma a projít, odkud která čísla jsou. Část rozdílu vysvětluje to, že Lidovky přestaly být prémiové, takže dnes je zamčených asi 600 článků měsíčně proti dřívějším 1 100 až 1 200. Schůzka 24. září proběhla jen s Andreou, Petr Kelin byl nemocný, společná se přeplánuje.","soucast":"Patří do dat a měření. Je to podmínka pro většinu ostatních úkolů v téhle oblasti.","typ":"Úkol","kdo":"Jakub Strýček","termin":null,"stav":"V procesu","priorita":"","zprava":"22. 9.: rozdíl vysvětluje hlavně to, že Lidovky přestaly být prémiové. Zamčených článků je dnes kolem 600 měsíčně, dřív 1 100–1 200. 24. 9.: schůzka proběhla jen s Andreou, Petr Kelin je nemocný. Společná schůzka se přeplánuje, nový termín zatím není.","zdroj":"Tým 22. 9.; Vedení 22. 9.; Andrea 24. 9."},{"id":76,"oblast":10,"ukol":"Postavit přehled článků, kvůli kterým lidé zaplatili","popis":"Jednoduchý seznam, ze kterého se pozná, co přivádí předplatitele. Redakce podle něj vybere, co dát do výkladní skříně a co zamknout. Srovnání za týden, za rok a za pět let ukáže, jestli jde o výkyv, nebo o trend.","jak":"Původně se počítalo s týdenním přehledem, ale Matyáš ho potřebuje denně před ranní poradou, protože za týden může odejít až 800 předplatitelů. Podoba se dohodne na schůzce ke sjednocení dat.","soucast":"Patří do dat a měření. Je to nástroj pro obsah i pro výkladní skříň na titulce.","typ":"Úkol","kdo":"Petr Kelin","termin":null,"stav":"Nezačalo","priorita":"","zprava":"22. 9.: podoba se dohodne na schůzce ke sjednocení dat. Původně týdenní. 24. 9.: Matyáš ho potřebuje denně před ranní poradou — za týden může odejít až 800 předplatitelů.","zdroj":"Tým 22. 9.; Vedení 22. 9.; Andrea 24. 9."},{"id":77,"oblast":10,"ukol":"Zpracovat data o tom, na kterých článcích lidé platí","popis":"Rozbor ukazuje, co nové předplatitele přivádí a co z toho plyne pro obsah, kampaně i pro výkladní skříň na titulce.","jak":"Data dodal Petr Kelin 21. září, vznikl z nich dokument pro klienta. Tým má vlastní rozbor a v závěrech se podle něj neliší.","soucast":"Patří do dat a měření.","typ":"Úkol","kdo":"Jakub Strýček","termin":"2026-09-21","stav":"Hotovo","priorita":"","zprava":"Data dodal Petr Kelin 21. 9. Tým má vlastní rozbor, v závěrech se podle týmu neliší.","zdroj":"Rozbor 21. 9.; Tým 22. 9."},{"id":78,"oblast":10,"ukol":"Připravit vedení přehled Premia na jednu stránku","popis":"Kolik lidí přibylo, kolik odešlo a kolik průměrně platí, rozdělené podle toho, odkud přišli a za jakou cenu. Vedení potřebuje jedno místo, kde se to dá zjistit, aniž by se muselo ptát.","jak":"Sestaví lidé od dat. Termín podle plánu je konec října.","soucast":"Patří do dat a měření a do řízení projektu.","typ":"Úkol","kdo":"data","termin":"2026-10-31","stav":"","priorita":"Teď","zprava":"","zdroj":"Plán 14. 9."},{"id":79,"oblast":10,"ukol":"Vyzkoušet, co se stane, když bude článků méně","popis":"Na čtrnáct dní vydávat kolem sta článků denně místo sto padesáti a porovnat výsledek se stejným obdobím loni. Míň článků může znamenat víc času na ty, které lidi opravdu přivedou. Bez pokusu je to jen názor.","jak":"Vybrat období, snížit počet a porovnat čísla očištěná o meziroční pokles. Termín podle plánu je konec listopadu.","soucast":"Patří do dat a měření a souvisí s obsahem.","typ":"Úkol","kdo":"data, Matyáš Kaiser","termin":"2026-11-30","stav":"","priorita":"Pak","zprava":"","zdroj":"Plán 14. 9."},{"id":80,"oblast":10,"ukol":"Zjistit, co nabídnout čtenářům s blokátorem reklam","popis":"Je jich 11 tisíc a nikdy nic nezaplatili. Reklama se jim neukáže, takže z nich dům nemá nic. Přitom je to skupina, která si zvykla za obsah neplatit, ale evidentně ho chce.","jak":"Popsat, kdo to je a co čtou, a navrhnout, co jim nabídnout. Termín podle plánu je leden 2027.","soucast":"Patří do dat a měření.","typ":"Úkol","kdo":"data","termin":"2027-01-31","stav":"","priorita":"Počká","zprava":"","zdroj":"Plán 14. 9."},{"id":81,"oblast":10,"ukol":"Sledovat, co zrušení rušivých reklam udělalo s příjmy z inzerce","popis":"Když předplatitelé nevidí dva reklamní formáty, přichází dům o část příjmů z reklamy. Aby se dalo říct, jestli se to vyplatí, musí se skutečnost každý měsíc porovnat s tím, co se čekalo.","jak":"Obchod připraví měsíční přehled pro vedení, první od října.","soucast":"Patří do dat a měření a doplňuje vyhodnocení změny ze 7. září.","typ":"Úkol","kdo":"obchod","termin":null,"stav":"","priorita":"","zprava":"Měsíčně od října.","zdroj":"Plán 14. 9."},{"id":82,"oblast":11,"ukol":"Napsat jednu větu, co je Premium, a slovník pro celý dům","popis":"Aby o Premiu mluvili všichni stejně, od redaktora po obchod. Slova jako exkluzivní výhody nebo zdarma mají zmizet, protože nic neříkají a čtenáři v hlavě nic nezůstane.","jak":"Napsat jednu větu, která platí pro všechny, a k ní krátký seznam slov, která používáme, a slov, kterým se vyhýbáme. Termín podle plánu je polovina října.","soucast":"Patří do značky. Je to základ, ze kterého se pak píše vstupní stránka, kampaň i e-maily.","typ":"Úkol","kdo":"marketing, Jakub Strýček","termin":"2026-10-15","stav":"","priorita":"Teď","zprava":"","zdroj":"Plán 14. 9."},{"id":83,"oblast":11,"ukol":"Vyzkoušet na čtenářích, kterým větám rozumějí","popis":"Než se věta dostane do kampaně, ověří se na vstupní stránce a v dotazníku, jestli lidem něco říká. Je levnější to zjistit na dvou stech lidech než na celé kampani.","jak":"Porovnat dvě až tři verze textu na vstupní stránce a doplnit to otázkou v dotazníku. Termín podle plánu je konec listopadu.","soucast":"Patří do značky a navazuje na jednu větu o Premiu.","typ":"Úkol","kdo":"marketing, data","termin":"2026-11-30","stav":"","priorita":"Pak","zprava":"","zdroj":"Plán 14. 9."},{"id":84,"oblast":11,"ukol":"Začít měřit, jak je značka Premium vidět","popis":"Sleduje se, kolik lidí přijde na iDNES přímo, kolik jich hledá slovo iDNES a co si o značce myslí předplatitelé. Bez toho se nepozná, jestli kampaň něco změnila, nebo jen utratila peníze.","jak":"Vybrat tři čísla, změřit dnešní stav a pak je sledovat pravidelně. Doplnit dotazníkem mezi předplatiteli. Termín podle plánu je konec října.","soucast":"Patří do značky a do měření.","typ":"Úkol","kdo":"data, marketing","termin":"2026-10-31","stav":"","priorita":"Teď","zprava":"","zdroj":"Plán 14. 9."},{"id":85,"oblast":11,"ukol":"Vyzkoušet dvě dvojice kampaní proti sobě","popis":"První pokus porovná kampaň postavenou na obsahu s kampaní postavenou na slevě. Druhý porovná redakční tón s výčtem výhod. Z výsledku se pozná, čím Premium prodávat, místo aby se o tom hádalo.","jak":"Pustit vždy dvě verze proti sobě, měřit stejná čísla a rozhodnout podle nich. Termín podle plánu je konec roku.","soucast":"Patří do značky a do marketingu.","typ":"Úkol","kdo":"data, marketing","termin":"2026-12-31","stav":"","priorita":"Pak","zprava":"","zdroj":"Plán 14. 9."},{"id":86,"oblast":11,"ukol":"Připravit značkovou kampaň a rozhodnout o logu","popis":"Velká kampaň má běžet v lednu a únoru 2027 spolu se spuštěním aplikace. Logo je poslední krok, ne první: mění se, až když je co ukázat.","jak":"Logo připravit do konce roku a ukázat v únoru. Vedení zatím říká, že změnu loga jen tak neschválí, až když porostou čísla.","soucast":"Patří do značky a váže se na start aplikace.","typ":"Úkol","kdo":"marketing","termin":"2027-02-28","stav":"","priorita":"Počká","zprava":"Plán uvádí únor 2027. 14. 9.: logo je nedůležité, dává smysl až v únoru. 22. 9.: vedení změnu loga jen tak neschválí, až když porostou čísla.","zdroj":"Plán 14. 9.; Schůzka 14. 9.; Vedení 22. 9."},{"id":87,"oblast":12,"ukol":"Najít člověka, který bude denně skládat do Premia obsah z časopisů","popis":"Někdo musí každý den vybrat hotové články z časopisů domu, poskládat je do Premia a napsat k nim poutavé titulky. Do textů nezasahuje, jsou už zeditované. Bez téhle práce zůstane obsah, který dům zaplatil, ležet nevyužitý.","jak":"Vybraný je Lubor Černohlávek z Tématu, Zdeněk Šuster je předběžně pro. Černohlávek o tom zatím neví a je potřeba vyřešit jeho odměnu, protože Téma ji samo nezaplatí. Posune to František.","soucast":"Patří do lidí a rolí. Odblokuje to úkol ukázat v Premiu obsah z Tématu.","typ":"Úkol","kdo":"Franta","termin":"2026-10-15","stav":"V procesu","priorita":"Teď","zprava":"22. 9.: vybraný je Lubor Černohlávek z Tématu, Zdeněk Šuster je předběžně pro. Černohlávek o tom zatím neví. Jeho odměnu je potřeba vyřešit, Téma ji samo nezaplatí. 2. 10.: termín 30. 9. prošel. Černohlávek o tom zatím neví a jeho odměna není vyřešená, proto nový termín 15. 10.","zdroj":"Plán 14. 9.; Schůzka 14. 9.; Úkoly 17. 9.; Vedení 22. 9."},{"id":88,"oblast":12,"ukol":"Obsadit roli člověka, který za obsah Premia odpovídá","popis":"Premium je obsahový produkt a nikdo za jeho obsah neodpovídá. Chybí člověk, který rozhodne, co vyjde, a prosadí to napříč redakcemi. Dokud tenhle člověk není, obsah se řeší od schůzky ke schůzce a nikdo ho nedrží.","jak":"Hledá František. Podle schůzky 22. září to potrvá, místo je stále neobsazené.","soucast":"Patří do lidí a rolí. Je to nejdůležitější chybějící role celého projektu.","typ":"Úkol","kdo":"Franta","termin":null,"stav":"V procesu","priorita":"","zprava":"22. 9.: místo je stále neobsazené, hledání potrvá.","zdroj":"Schůzka 14. 9.; Úkoly 17. 9.; Vedení 22. 9."},{"id":89,"oblast":12,"ukol":"Najít člověka, který bude obsah Premia balit a propagovat","popis":"Seriály, upoutávky a kampaně dnes nemá kdo dělat, takže obsah vyjde a nikdo se o něm nedozví.","jak":"Dočasně může pomoct Markéta, stálý člověk zatím není. Podle Jakuba to nemusí být hned. Markéta má vzít komunikaci s agenturou ke kampani k aplikaci, balení obsahu tím ale vyřešené není.","soucast":"Patří do lidí a rolí. Odblokuje to propagaci obsahu.","typ":"Úkol","kdo":"","termin":null,"stav":"Nezačalo","priorita":"","zprava":"22. 9.: stálý člověk zatím není. Dočasně může pomoct Markéta. Podle Jakuba to není nutné hned. 24. 9.: Markéta má vzít komunikaci s agenturou ke kampani, balení obsahu tím ale vyřešené není.","zdroj":"Schůzka 14. 9.; Úkoly 17. 9.; Vedení 22. 9.; Andrea 24. 9."},{"id":90,"oblast":12,"ukol":"Zajistit Matyášovi přístup k obsahu ostatních titulů","popis":"Matyáš skládá obsah Premia a musí si moct vzít článek z kteréhokoli ti
