tulu domu. Bez přístupu se u každého textu doprošuje.","jak":"František to v ostatních titulech zajistí, dohodnuto 14. září.","soucast":"Patří do lidí a rolí a souvisí s obsahem.","typ":"Úkol","kdo":"Franta","termin":null,"stav":"","priorita":"","zprava":"14. 9.: Franta to v ostatních titulech zajistí.","zdroj":"Schůzka 14. 9."},{"id":91,"oblast":12,"ukol":"Navrhnout malý tým, který bude dělat jen Premium","popis":"Dnes na produktu pracují dva a půl člověka a dělí se o Premium s dalšími věcmi. Návrh má říct, kolik lidí je potřeba, odkud přijdou a od kdy.","jak":"Sestaví Matyáš Kaiser s Lukášem. Termín podle plánu je polovina října.","soucast":"Patří do lidí a rolí.","typ":"Úkol","kdo":"Matyáš Kaiser, Lukáš","termin":"2026-10-15","stav":"","priorita":"Teď","zprava":"","zdroj":"Plán 14. 9."},{"id":92,"oblast":13,"ukol":"Potvrdit, že Premium je nejlepší verze iDNESu, a říct to domu","popis":"Premium není web bez zámku, ale nejlepší verze iDNESu. Z tohohle jednoho rozhodnutí plyne všechno ostatní: co se zamyká, co se staví a jak se o Premiu mluví.","jak":"Vedení strategii schválilo 14. září. Zbývá to říct celému domu jednou větou, aby to slyšeli i lidé, kteří na schůzce nebyli. V zápisech to zatím není.","soucast":"Patří do řízení. Je to výchozí rozhodnutí celého projektu.","typ":"Rozhodnutí","kdo":"Michal Hanák, Lukáš","termin":"2026-09-30","stav":"Hotovo","priorita":"","zprava":"14. 9.: strategie schválená. Sdělení domu jednou větou v zápisech zatím není.","zdroj":"Plán 14. 9.; Schůzka 14. 9."},{"id":93,"oblast":13,"ukol":"Určit jednoho člověka, který Premium vlastní","popis":"Jeden člověk s rozpočtem, lidmi a právem říct redakci, co se zamyká. Bez toho se rozhodování rozmělní mezi několik oddělení a nikdo neodpovídá za výsledek.","jak":"Vlastníkem je od 14. září Matyáš Kaiser, šéfredaktor iDNES. Kdo vlastní značku iDNES jako takovou, v zápisech určené není.","soucast":"Patří do řízení.","typ":"Rozhodnutí","kdo":"Michal Hanák, Franta","termin":"2026-09-30","stav":"Hotovo","priorita":"","zprava":"14. 9.: vlastníkem je Matyáš Kaiser, šéfredaktor iDNES. Vlastník značky iDNES v zápisech určený není.","zdroj":"Plán 14. 9.; Schůzka 14. 9."},{"id":94,"oblast":13,"ukol":"Určit, kdo rozhodne, když se Premium a inzerce střetnou","popis":"Na webu i v titulech je omezené místo. Když ho chce Premium i inzerce, musí být předem jasné, kdo rozhodne, jinak vyhraje ten hlasitější.","jak":"Vyřízeno 14. září: při střetu rozhodují Michal Hanák a František.","soucast":"Patří do řízení.","typ":"Rozhodnutí","kdo":"Michal Hanák, Franta","termin":null,"stav":"Hotovo","priorita":"","zprava":"14. 9.: vyřízeno. Při kolizi s inzercí rozhodují Michal a Franta.","zdroj":"Plán 14. 9.; Schůzka 14. 9."},{"id":95,"oblast":13,"ukol":"Určit, kolik místa má Premium dostat na iDNESu a v titulech","popis":"Aby se o prostor pro Premium nevyjednávalo pokaždé znovu, má být daný dopředu: kolik místa na titulce a kolik v tištěných titulech.","jak":"Místo na titulce řeší výkladní skříň. Zbytek má rozhodnout Lukáš, termín podle plánu je konec října.","soucast":"Patří do řízení.","typ":"Rozhodnutí","kdo":"Lukáš","termin":"2026-10-31","stav":"","priorita":"Teď","zprava":"Místo na titulce řeší výkladní skříň.","zdroj":"Plán 14. 9."},{"id":96,"oblast":13,"ukol":"Potvrdit, že 200 tisíc předplatitelů je příprava na placený iDNES","popis":"Dvě stě tisíc spokojených předplatitelů má připravit den, kdy může být placený celý iDNES. Je to vnitřní horizont pro vedení, bez termínu a ne pro veřejnost, ale mění pohled na to, proč se dnešní kroky dělají.","jak":"Potvrdí Michal Hanák. Termín podle plánu je konec září.","soucast":"Patří do řízení a je to rámec, do kterého zapadá celý plán.","typ":"Rozhodnutí","kdo":"Michal Hanák","termin":"2026-10-15","stav":"","priorita":"Teď","zprava":"2. 10.: termín 30. 9. prošel, posunuto na 15. 10.","zdroj":"Plán 14. 9."},{"id":97,"oblast":13,"ukol":"Doplnit k cíli v počtu lidí i cíl v penězích","popis":"Počet předplatitelů sám o sobě nestačí, protože ne každý platí stejně. Vedle počtu musí být i cíl v tržbách a průměrná platba na člověka, jinak se dá cíl splnit slevami a dům na tom vydělá míň.","jak":"Řeší finance s Lukášem. Otevřené zůstává, jestli Lukáš přepracuje svůj plán, nebo poběží dvě varianty. Cílové číslo se doplní až při sestavování rozpočtu.","soucast":"Patří do řízení a je to vstup do rozpočtu na rok 2027.","typ":"Rozhodnutí","kdo":"finance, Lukáš","termin":"2026-10-15","stav":"V procesu","priorita":"Teď","zprava":"14. 9.: otevřené, jestli Lukáš přepracuje svůj plán, nebo poběží dvě varianty. 22. 9.: cílové číslo tržeb zůstává otevřené až do sestavení rozpočtu.","zdroj":"Plán 14. 9.; Schůzka 14. 9.; Vedení 22. 9."},{"id":98,"oblast":13,"ukol":"Zavést pravidlo, že se malé věci zkoušejí místo schvalování","popis":"Co se dá ověřit na jedné rubrice za čtyři týdny, se má zkusit, ne schvalovat. Většina sporů v projektu je o názory, které by jeden pokus rozhodl rychleji a levněji.","jak":"Potvrdí Michal Hanák. Termín podle plánu je konec října.","soucast":"Patří do řízení a zrychluje práci ve všech ostatních oblastech.","typ":"Rozhodnutí","kdo":"Michal Hanák","termin":"2026-10-31","stav":"","priorita":"Teď","zprava":"","zdroj":"Plán 14. 9."},{"id":99,"oblast":13,"ukol":"Vést jeden přehled všech úkolů Premia","popis":"Tenhle soubor. Jeden seznam, kde je u každého úkolu vidět, co se má udělat, jak, proč, kdo to má na starosti a do kdy. Aby se všichni dívali na totéž a projekt se nerozběhl do různých směrů.","jak":"Přehled vede Jakub, Andrea už má hodně práce s aplikací. Úkoly se seřadí podle priority, nasdílí týmu a za čtrnáct dní se spolu projdou.","soucast":"Patří do řízení projektu.","typ":"Úkol","kdo":"Jakub Strýček","termin":null,"stav":"V procesu","priorita":"Teď","zprava":"22. 9.: přehled povede Jakub. Andrea už má hodně práce s aplikací. 24. 9.: doplněn o schůzku s Andreou (verze 5). Jakub úkoly seřadí podle priority, nasdílí je týmu a za 14 dní se spolu projdou. 2. 10.: přehled běží průběžně, verze 4 je živý odkaz se společnou databází. Termín proto nemá, úkoly jsou seřazené podle priority.","zdroj":"Vedení 22. 9.; Andrea 24. 9."},{"id":100,"oblast":13,"ukol":"Posílat každý pátek písemné shrnutí týdne","popis":"Krátká zpráva pro Michala a Františka: co se za týden udělalo a co se zadrhává. Michalovi stačí jednou týdně, takže se mezitím nemusí nic posílat.","jak":"Píše Jakub každý pátek.","soucast":"Patří do řízení projektu.","typ":"Úkol","kdo":"Jakub Strýček","termin":"2026-10-02","stav":"V procesu","priorita":"Teď","zprava":"Opakuje se každý pátek. 2. 10.: nejbližší pátek je dnes.","zdroj":"Schůzka 14. 9.; Vedení 22. 9."},{"id":101,"oblast":13,"ukol":"Založit sdílený projekt Premium 2.0","popis":"Úkoly a dokumenty na jednom místě, kam mají přístup všichni v týmu. Dnes jsou roztroušené po e-mailech a zápisech, takže každý pracuje s jinou verzí.","jak":"Dohodnuto s týmem 22. září, nástrojem má být Asana. Kdo projekt založí, zápis neuvádí.","soucast":"Patří do řízení projektu.","typ":"Úkol","kdo":"","termin":null,"stav":"","priorita":"","zprava":"22. 9.: dohodnuto s týmem. Kdo ho založí, zápis neuvádí.","zdroj":"Tým 22. 9."},{"id":102,"oblast":13,"ukol":"Ověřit, že se stránky Premia nedělají dvakrát","popis":"Na schůzce zaznělo, že výkladní skříň a stránky Premia by mohly být součástí chystaného redesignu iDNESu. Kdyby na tom pracovaly dva týmy odděleně, zaplatí dům stejnou práci dvakrát.","jak":"Doptat se lidí kolem redesignu, co přesně mají v zadání. Na schůzce zaznělo, že to někdo zjistí druhý den, ze zápisu není jasné kdo.","soucast":"Patří do řízení a souvisí s výkladní skříní.","typ":"Úkol","kdo":"","termin":"2026-10-09","stav":"","priorita":"Teď","zprava":"22. 9.: zaznělo „zjistím to zítra“, ze zápisu není jasné, kdo to řekl. 2. 10.: termín 23. 9. prošel a ze zápisu pořád není jasné, kdo to měl zjistit. Nový termín 9. 10.","zdroj":"Vedení 22. 9."},{"id":103,"oblast":14,"ukol":"Dát předplatitelům tištěné MF DNES i Premium","popis":"Kdo platí tištěnou MF DNES, dostane Premium k tomu. Jsou to lidé, kteří za zprávy platit umějí, takže je levnější je přivést než hledat úplně nové.","jak":"Do konce března 2027 připravit techniku, smlouvy a oznámení, start v květnu 2027.","soucast":"Patří do propojení s celým vydavatelstvím.","typ":"Úkol","kdo":"tisk a tituly, produkt","termin":"2027-03-31","stav":"","priorita":"Počká","zprava":"","zdroj":"Plán 14. 9."},{"id":104,"oblast":14,"ukol":"Zavést jedno přihlášení pro všechny tituly","popis":"Jeden účet pro iDNES, Lidovky, Expres i tisk. Dnes se člověk přihlašuje pokaždé jinam, takže se část lidí cestou ztratí.","jak":"Řeší produkt s vývojem. Termín podle plánu je konec února 2027.","soucast":"Patří do propojení s celým vydavatelstvím a je podmínkou pro trafiku i pro balíčky.","typ":"Úkol","kdo":"produkt, vývoj","termin":"2027-02-28","stav":"","priorita":"Počká","zprava":"","zdroj":"Plán 14. 9."},{"id":105,"oblast":14,"ukol":"Postavit první verzi trafiky vydavatelství","popis":"MF DNES, Lidovky a Metro jako běžné články ve světě iDNESu a k tomu vybrané texty z placených titulů. Čtenář má všechno na jednom místě místo pěti webů.","jak":"Řeší produkt, vývoj a tištěné tituly. Termín podle plánu je květen 2027.","soucast":"Patří do propojení s celým vydavatelstvím.","typ":"Úkol","kdo":"produkt, vývoj, tisk a tituly","termin":"2027-05-31","stav":"","priorita":"Počká","zprava":"","zdroj":"Plán 14. 9."},{"id":106,"oblast":14,"ukol":"Domluvit balíček s mobilním operátorem","popis":"Premium jako součást nabídky operátora. Operátor má miliony zákazníků a zavedené placení, takže přivede lidi, kteří by si předplatné sami nekoupili.","jak":"Najít partnera a dohodnout dělení tržby. Příprava do konce ledna 2027, start v dubnu 2027.","soucast":"Patří k partnerům.","typ":"Úkol","kdo":"obchod, Lukáš","termin":"2027-01-31","stav":"","priorita":"Počká","zprava":"","zdroj":"Plán 14. 9."},{"id":107,"oblast":14,"ukol":"Připravit nabídku Premia pro firmy","popis":"Licence pro celou firmu, aby Premium mohli číst všichni zaměstnanci. Jedna smlouva místo stovek jednotlivých předplatných.","jak":"Řeší obchod. Příprava do konce května 2027, start v srpnu 2027.","soucast":"Patří k partnerům.","typ":"Úkol","kdo":"obchod","termin":"2027-05-31","stav":"","priorita":"Počká","zprava":"","zdroj":"Plán 14. 9."},{"id":108,"oblast":14,"ukol":"Připravit Premium pro armádu","popis":"Vlastní titulní strana pro vojáky, bez slev, ale se čtením bez internetu, které se hodí tam, kde není signál. Měřit se budou aktivní účty, ne počet rozdaných přístupů.","jak":"Řeší Lukáš s produktem. Termín podle plánu je konec října.","soucast":"Patří k partnerům.","typ":"Úkol","kdo":"Lukáš, produkt","termin":"2026-10-31","stav":"","priorita":"Teď","zprava":"","zdroj":"Plán 14. 9."},{"id":109,"oblast":14,"ukol":"Měřit u každého partnerství, co doopravdy přineslo","popis":"U partnerství jako Alza, ISIC nebo Canal+ se dnes hlásí, kolik lidí se oslovilo. To ale nic neříká. Sledovat se má, kolik z nich si Premium koupilo a kolik u něj zůstalo.","jak":"Marketing u každého partnerství průběžně eviduje nákupy a udržení.","soucast":"Patří k partnerům a do měření.","typ":"Úkol","kdo":"marketing","termin":null,"stav":"","priorita":"","zprava":"Průběžně.","zdroj":"Plán 14. 9."},{"id":110,"oblast":14,"ukol":"Přepracovat model spolupráce se sportovními kluby","popis":"Dnešní model Premium partner staví iDNES do role partnera klubu. Dům ale musí zůstat neutrální, jinak přijde o důvěru fanoušků ostatních klubů.","jak":"Řeší Lukáš se sportem. Termín podle plánu je konec roku.","soucast":"Patří ke sportu a k partnerům.","typ":"Úkol","kdo":"Lukáš, sport","termin":"2026-12-31","stav":"","priorita":"Pak","zprava":"","zdroj":"Plán 14. 9."},{"id":111,"oblast":14,"ukol":"Dostat do Premia sportovní obsah","popis":"Zákulisí, komentované zápasy a hokejové mistrovství den po dni. Sport má silné publikum zvyklé sledovat pravidelně, jen musí mluvit stejným hlasem jako zbytek Premia.","jak":"Připravuje sport se šéfredaktorem, od začátku sezony.","soucast":"Patří ke sportu.","typ":"Úkol","kdo":"sport, Matyáš Kaiser","termin":null,"stav":"","priorita":"","zprava":"Od sezóny.","zdroj":"Plán 14. 9."},{"id":112,"oblast":14,"ukol":"Připravit sportovní balíček jako samostatnou nabídku","popis":"Vlastní balíček pro fanoušky: práva na přenosy, data ze zápasů a aplikace. Je to samostatný produkt, který může mít vlastní cenu i publikum.","jak":"Řeší sport s produktem. Příprava do konce června 2027, start v říjnu 2027.","soucast":"Patří ke sportu a k partnerům.","typ":"Úkol","kdo":"sport, produkt","termin":"2027-06-30","stav":"","priorita":"Počká","zprava":"","zdroj":"Plán 14. 9."},{"id":113,"oblast":8,"ukol":"Projít na schůzce, co která funkce udělá s vývojem aplikace","popis":"U každé funkce ze seznamu si říct, co znamená pro aplikaci: co jde hned, co počká a co by posunulo spuštění. Co se vymyslí pro web, se do aplikace přidává pomaleji a dráž, proto se to musí rozhodnout dřív, než bude aplikace hotová.","jak":"Čtvrtek 1. října, Jakub s Andreou. Přizvat Lukáše a za marketing Markétu.","soucast":"Patří k aplikaci a propojuje ji s funkcemi Premia na webu.","typ":"Úkol","kdo":"Jakub Strýček, Andrea","termin":"2026-10-09","stav":"V procesu","priorita":"Teď","zprava":"24. 9.: domluveno na čtvrtek 1. 10. Přizvat Lukáše a za marketing Markétu. Co se vymyslí pro web, se do aplikace přidává pomaleji a dráž, proto se to musí rozhodnout dřív, než se aplikace dodělá. 2. 10.: schůzka 1. 10. proběhla, aplikace se zkouší přes TestFlight. Dokončit na schůzce ve čtvrtek 9. 10.","zdroj":"Andrea 24. 9."},{"id":114,"oblast":8,"ukol":"Domluvit, pro koho aplikaci děláme a jak se bude prodávat","popis":"Výkop ke spuštění: komu je aplikace určená, co od ní čekáme a jak se bude nabízet. Podle toho se kreslí zbytek aplikace, takže čím dřív, tím líp.","jak":"Druhá ze dvou schůzek 1. října. Pracovní názvy jsou funkce pro Premium a aplikace s kampaní.","soucast":"Patří k aplikaci a k marketingu.","typ":"Úkol","kdo":"Jakub Strýček, Andrea","termin":"2026-10-01","stav":"Hotovo","priorita":"","zprava":"24. 9.: druhá ze dvou schůzek 1. 10. Pracovní názvy: funkce pro Premium a aplikace s kampaní. 2. 10.: schůzka proběhla 1. 10. odpoledne. Vyšlo z ní zadání pro kampaň: komu aplikaci říkáme, čím ji prodáváme a start na přelomu ledna a února.","zdroj":"Andrea 24. 9."},{"id":115,"oblast":8,"ukol":"Sepsat pro vedení doporučení, kterou cestou s aplikací jít","popis":"Po obou schůzkách vznikne krátký materiál s doporučením a pošle se vedení k potvrzení. Rozhodnutí musí dům udržet, jinak se aplikace do konce ledna nedodělá.","jak":"Prezentaci pro Michala a Františka připraví Jakub, dohodnuto s Andreou.","soucast":"Patří k aplikaci a k řízení projektu.","typ":"Úkol","kdo":"Jakub Strýček","termin":"2026-10-09","stav":"Nezačalo","priorita":"Teď","zprava":"24. 9.: prezentaci pro Michala a Frantu udělá Jakub, dohodnuto s Andreou. 2. 10.: obě schůzky 1. 10. proběhly, doporučení pro Michala a Frantu je na řadě. Termín 9. 10.","zdroj":"Andrea 24. 9."},{"id":116,"oblast":8,"ukol":"Upravit první spuštění aplikace a žádost o upozornění","popis":"Když aplikace na úvod ukáže osm obrazovek za sebou, většina lidí je proklikne a nic si nezapamatuje. Systémové okno se žádostí o upozornění se navíc dá odmítnout jen jednou a natrvalo, takže nesmí vyskočit hned. Návrh je zeptat se vlastním oknem až po třetí návštěvě zpráv.","jak":"Takhle je to namyšlené. Zadání vzniklo v červnu, s novými funkcemi se bude ladit.","soucast":"Patří k aplikaci.","typ":"Úkol","kdo":"Andrea","termin":null,"stav":"V procesu","priorita":"","zprava":"24. 9.: takhle je to namyšlené. Zadání vzniklo v červnu, s novými funkcemi se bude ladit.","zdroj":"Andrea 24. 9."},{"id":117,"oblast":9,"ukol":"Umět včas najít předplatitele, kteří přestali chodit","popis":"Kdo se sedm až deset dní neukázal, je na odchodu. Dnes se to dozvíme až ve chvíli, kdy zruší platbu. Když to budeme vědět dřív, dá se mu poslat e-mail, který ho vrátí. Pro představu: v jeden zářijový den přibylo 48 nových předplatných a 77 lidí zrušilo.","jak":"Zavést jednoduché pravidlo, kdo je ohrožený, a automatický seznam takových lidí, na který navazuje záchranný e-mail. Jakub to označil za základ celého udržení.","soucast":"Patří do udržení předplatitelů a potřebuje k tomu datový přehled.","typ":"Úkol","kdo":"Andrea, data","termin":null,"stav":"Nezačalo","priorita":"","zprava":"24. 9.: Jakub to označil za základ celého udržení. Dnešní bilance: 48 nových proti 77 zrušeným.","zdroj":"Andrea 24. 9."},{"id":118,"oblast":9,"ukol":"Připravit nabídku pro pět tisíc lidí z červnové akce","popis":"V červnu přišlo na akční nabídku pět tisíc lidí a v lednu jim předplatné končí. Jestli se nic neudělá, odejdou skoro naráz. Nabídka se musí lišit podle toho, kolik kdo čte: kdo nečte skoro nic, potřebuje jinou než ten, kdo čte denně.","jak":"Kampaň musí odejít v prvních týdnech ledna, takže se připravuje v prosinci. Ručně to při pěti tisících lidech nejde, potřeba je k tomu datový přehled.","soucast":"Patří do udržení předplatitelů.","typ":"Úkol","kdo":"Andrea","termin":"2026-12-01","stav":"Nezačalo","priorita":"Pak","zprava":"24. 9.: kampaň musí odejít v prvních týdnech ledna, takže se připravuje v prosinci. Ručně to při pěti tisících lidech nejde.","zdroj":"Andrea 24. 9."},{"id":119,"oblast":10,"ukol":"Postavit přehled, ve kterém se udržení řídí podle čísel","popis":"Karta čtenáře převedená do živých dat, aby se retenční kampaně daly řídit průběžně, a ne ručně. Dům data měří, ale chybí vrstva, ve které se zobrazí, takže je dnes musí někdo skládat ručně z pěti systémů.","jak":"Andrea ho potřebuje do konce listopadu kvůli lednové vlně končících předplatných. Buď se rozšíří dnešní systém, nebo se postaví první verze v Power BI či podobném nástroji. Historie čtení se drží jen 30 dní, s tím je potřeba počítat. Když na to dům nebude mít kapacitu, Jakub půjčí analytika.","soucast":"Patří do dat a měření a je to podmínka pro většinu úkolů v udržení předplatitelů.","typ":"Úkol","kdo":"Andrea, Petr Kelin","termin":"2026-11-30","stav":"Nezačalo","priorita":"Pak","zprava":"24. 9.: Andrea ho potřebuje do konce listopadu kvůli lednové vlně. Buď se rozšíří dnešní systém, nebo se postaví první verze v Power BI či podobném přehledu; historie čtení se drží 30 dní. Když na to nebude kapacita, Jakub půjčí analytika.","zdroj":"Andrea 24. 9."},{"id":120,"oblast":12,"ukol":"Určit Markétu jako spojku na externí agenturu","popis":"Kampaň k aplikaci nejspíš povede externí agentura. Někdo uvnitř jí musí zadávat práci a kontrolovat, co odevzdá, jinak agentura dělá, co uzná za vhodné. Má to být člověk z marketingu, ne produkt ani konzultant.","jak":"Andrea a Jakub se na Markétě shodli 24. září. Zbývá to potvrdit s ní i s jejím vedoucím.","soucast":"Patří do lidí a rolí a váže se na kampaň k aplikaci.","typ":"Návrh","kdo":"Markéta","termin":null,"stav":"Nezačalo","priorita":"","zprava":"24. 9.: Andrea a Jakub se shodli na Markétě. Produkt ani konzultant tuhle roli dělat nemají.","zdroj":"Andrea 24. 9."},{"id":121,"oblast":2,"ukol":"Vytvořit prezentaci s konceptem kampaně na novou aplikaci iDNES","popis":"Materiál pro vedení a pro agenturu. Je v něm, komu aplikaci říkáme, hlavní myšlenka a linka, podpis kampaně, úpravy pro mladší čtenáře a pro čtenáře konkurence, hlavní film, tisk, časování po fázích, mix kanálů a měření. Bez schváleného konceptu nejde zadat agentuře ani objednat reklamu.","jak":"Koncept je prezentace v 16:9. Nejdřív se dohodne hlavní myšlenka a podpis kampaně, pak se k nim dokreslí jednotlivé formáty. Po schválení vedením slouží jako zadání pro agenturu.","soucast":"Patří do marketingu a ke startu aplikace. Visí na něm zadání pro agenturu a objednávka reklamního prostoru.","typ":"Úkol","kdo":"Jakub Strýček, Markéta","termin":"2026-10-09","stav":"V procesu","priorita":"Teď","zprava":"2. 10.: koncept je sepsaný, verze 17 má 18 listů. Claim a formáty se probírají s Markétou z marketingu. Pak schválení u vedení a předání agentuře.","zdroj":"Aplikace 1. 10.; Data 1. 10.; Andrea 24. 9."}]};

let pridane = {};          // docId -> úkol
let lide = ZAKLAD.lide.slice();
let otevreny = null;

/* Stránka běží ve dvou režimech. V živém odkazu ukládá do společné databáze.
   Když ji někdo otevře jako soubor, ukládá do prohlížeče, ve kterém je otevřená. */
const JAKO_SOUBOR = !(window.claude && window.claude.use);
const K_STAV = 'ukolnik_v4_stav', K_NOVE = 'ukolnik_v4_nove';
function nactiMistni(){
  try{ prekryv = JSON.parse(localStorage.getItem(K_STAV) || '{}') || {};
       pridane = JSON.parse(localStorage.getItem(K_NOVE) || '{}') || {}; }
  catch(e){ prekryv = {}; pridane = {}; }
}
function ulozMistni(){
  try{ localStorage.setItem(K_STAV, JSON.stringify(prekryv));
       localStorage.setItem(K_NOVE, JSON.stringify(pridane)); return true; }
  catch(e){ return false; }
}
function hlasUlozeno(){
  el('stavUloz').textContent = ulozMistni() ? 'uloženo v tomhle prohlížeči' : 'prohlížeč neukládá, změna platí jen teď';
}

const S = { pohled:'prehled', oblast:null, hledat:'', stav:'', prio:'', termin:'', moje:false, asana:false, detaily:true };

/* ---------- pomůcky ---------- */
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el = id => document.getElementById(id);
function hlaska(t){ const h=el('hlaska'); h.textContent=t; h.classList.add('on'); clearTimeout(h._t); h._t=setTimeout(()=>h.classList.remove('on'),2200); }
function mistni(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }
const dnes = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
function dnu(t){ if(!t) return null; const d=new Date(t+'T00:00:00'); if(isNaN(d)) return null; return Math.round((d-dnes())/86400000); }
function datum(t){ if(!t) return ''; const d=new Date(t+'T00:00:00'); if(isNaN(d)) return t;
  const r=d.getFullYear()===new Date().getFullYear() ? '' : ' '+d.getFullYear();
  return d.getDate()+'. '+(d.getMonth()+1)+'.'+r; }
function termText(t){ const n=dnu(t); if(n===null) return ''; if(n<0) return 'po termínu o '+Math.abs(n)+' dní'; if(n===0) return 'dnes'; if(n===1) return 'zítra'; return 'za '+n+' dní'; }

function vsechny(){
  const zak = ZAKLAD.ukoly.map(u => Object.assign({}, u, prekryv[u.id] || {}));
  const nov = Object.keys(pridane).map(k => Object.assign({ docId:k, novy:true }, pridane[k]));
  return zak.concat(nov);
}
function oblastNazev(id){ const o = ZAKLAD.oblasti.find(x => x.id === id); return o ? o.nazev : 'Bez oblasti'; }

function filtr(list){
  const q = S.hledat.trim().toLowerCase();
  const ja = mistni('ukolnik_ja') || '';
  return list.filter(u => {
    if(S.oblast && u.oblast !== S.oblast) return false;
    if(S.stav && (u.stav||'') !== S.stav) return false;
    if(S.prio && (u.priorita||'') !== S.prio) return false;
    if(S.asana && !u.asana) return false;
    if(S.moje && !(ja && (u.kdo||'').toLowerCase().includes(ja.toLowerCase()))) return false;
    if(S.termin){
      const n = dnu(u.termin);
      if(S.termin==='bez' && u.termin) return false;
      if(S.termin==='po' && !(n!==null && n<0 && (u.stav||'')!=='Hotovo')) return false;
      if(S.termin==='tyden' && !(n!==null && n>=0 && n<=7)) return false;
    }
    if(q){
      const s = [u.ukol,u.popis,u.jak,u.soucast,u.kdo,u.zprava].join(' ').toLowerCase();
      if(!s.includes(q)) return false;
    }
    return true;
  });
}
function pocty(list){
  const p = {celkem:list.length, hotovo:0, proces:0, zbytek:0, po:0};
  list.forEach(u => { const s=u.stav||''; if(s==='Hotovo') p.hotovo++; else if(s==='V procesu') p.proces++; else p.zbytek++;
    const n=dnu(u.termin); if(n!==null && n<0 && s!=='Hotovo') p.po++; });
  return p;
}
function pasHTML(list){
  const p = pocty(list), c = p.celkem || 1;
  return '<div class="pas"><i class="h" style="width:'+(p.hotovo/c*100)+'%"></i><i class="p" style="width:'+(p.proces/c*100)+'%"></i><i class="n" style="width:'+(p.zbytek/c*100)+'%"></i></div>';
}

/* ---------- zápis do sdílené databáze ---------- */
async function zapis(u, zmena){
  Object.assign(u, zmena);
  if(JAKO_SOUBOR){
    const kdoJa = mistni('ukolnik_ja') || '';
    const t = Object.assign({}, (u.novy ? pridane[u.docId] : prekryv[u.id]) || {}, zmena,
      { zmeneno:new Date().toISOString(), zmenil:kdoJa });
    if(u.novy) pridane[u.docId] = t; else prekryv[u.id] = t;
    hlasUlozeno(); vykresli(); return;
  }
  if(!db){ hlaska('Sdílené ukládání není v tomhle zobrazení dostupné'); vykresli(); return; }
  if(muzePsat === false){ hlaska('Tenhle odkaz máš jen ke čtení'); return; }
  const kdoJa = mistni('ukolnik_ja') || '';
  try{
    if(u.novy){
      const t = Object.assign({}, pridane[u.docId] || {}, zmena, { zmeneno:new Date().toISOString(), zmenil:kdoJa });
      pridane[u.docId] = t;
      await db.collection('nove').doc(u.docId).set(t);
    } else {
      const t = Object.assign({}, prekryv[u.id] || {}, zmena, { zmeneno:new Date().toISOString(), zmenil:kdoJa });
      prekryv[u.id] = t;
      await db.collection('stav').doc(String(u.id)).set(t);
    }
    el('stavUloz').textContent = 'uloženo ' + new Date().toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    if(e && e.code === 'invalid_argument'){ muzePsat = false; hlaska('Tenhle odkaz máš jen ke čtení'); }
    else hlaska('Uložení se nepovedlo, zkus to znovu');
  }
  vykresli();
}

/* ---------- vykreslení ---------- */
function vykresliBok(){
  const z = vsechny();
  let h = '<h4>Vše</h4>';
  h += '<button class="pol'+(S.oblast?'':' on')+'" data-ob="0"><span class="r"><span class="nm">Všechny úkoly</span><span class="c">'+z.length+'</span></span>'+pasHTML(z)+'</button>';
  h += '<h4>Oblasti</h4>';
  ZAKLAD.oblasti.forEach(o => {
    const cl = z.filter(u => u.oblast === o.id); if(!cl.length) return;
    h += '<button class="pol'+(S.oblast===o.id?' on':'')+'" data-ob="'+o.id+'"><span class="r"><span class="nm">'+esc(o.nazev)+'</span><span class="c">'+cl.length+'</span></span>'+pasHTML(cl)+'</button>';
  });
  el('bok').innerHTML = h;
}

function radekHTML(u){
  const s = u.stav||'', p = u.priorita||'', n = dnu(u.termin);
  let h = '<div class="radek" data-id="'+(u.novy?('n:'+u.docId):u.id)+'">';
  h += '<button class="chip '+SCL[s]+'" data-cyk="'+(u.novy?('n:'+u.docId):u.id)+'" title="Klikni pro změnu stavu">'+esc(s||'bez stavu')+'</button>';
  h += '<div class="txt"><div class="nm">'+esc(u.ukol)+'</div>';
  const plne = S.detaily && S.pohled === 'seznam';
  if(plne){
    if(u.popis) h += '<p class="vic">'+esc(u.popis)+'</p>';
    if(u.jak) h += '<p class="vic"><b>Jak na to:</b> '+esc(u.jak)+'</p>';
    if(u.soucast) h += '<p class="vic"><b>Čeho je to součást:</b> '+esc(u.soucast)+'</p>';
    if(u.zprava) h += '<p class="vic zpr">'+esc(u.zprava)+'</p>';
  }
  h += '<div class="meta">';
  h += '<span>'+esc(oblastNazev(u.oblast))+'</span>';
  if(u.kdo) h += '<span><b>'+esc(u.kdo)+'</b></span>';
  if(u.termin) h += '<span class="mono'+((n!==null&&n<0&&s!=='Hotovo')?' chip po':'')+'">'+esc(datum(u.termin))+(n!==null?' · '+termText(u.termin):'')+'</span>';
  if(p) h += '<span class="chip '+PCL[p]+'">'+esc(p)+'</span>';
  if(u.asana) h += '<span class="chip as znacka-as">Asana</span>';
  if(plne && u.typ && u.typ !== 'Úkol') h += '<span class="chip">'+esc(u.typ)+'</span>';
  if(plne && u.zdroj) h += '<span class="mono">'+esc(u.zdroj)+'</span>';
  h += '</div></div></div>';
  return h;
}

function vykresliPrehled(){
  const z = vsechny(), f = filtr(z), p = pocty(f);
  const ja = mistni('ukolnik_ja') || '';
  let h = '<div class="nadpis"><div><h2>Přehled</h2><p>'+esc(ZAKLAD.cil)+'</p></div><span class="poc">'+f.length+' úkolů</span></div>';
  h += '<div class="ctyri">';
  h += '<div class="cis"><b>'+p.celkem+'</b><span>úkolů ve '+ZAKLAD.oblasti.length+' oblastech</span></div>';
  h += '<div class="cis"><b>'+p.proces+'</b><span>rozdělaných</span></div>';
  h += '<div class="cis"><b>'+p.hotovo+'</b><span>hotových</span></div>';
  h += '<div class="cis'+(p.po?' varuj':'')+'"><b>'+p.po+'</b><span>po termínu</span></div>';
  h += '</div>';

  const bezStavu = f.filter(u => !(u.stav||''));
  if(bezStavu.length){
    h += '<div class="karta"><h3>Čeká na odškrtnutí</h3><p style="font-size:13.5px;color:var(--text2)">'+bezStavu.length+' úkolů nemá nastavený stav. Klikni na odznak vlevo u řádku a stav se přepne.</p>';
    h += bezStavu.slice(0,6).map(radekHTML).join('');
    if(bezStavu.length>6) h += '<button class="tl" data-vse="1">Zobrazit všech '+bezStavu.length+'</button>';
    h += '</div>';
  }
  const poTerminu = f.filter(u => { const n=dnu(u.termin); return n!==null && n<0 && (u.stav||'')!=='Hotovo'; })
                     .sort((a,b)=> (a.termin<b.termin?-1:1));
  if(poTerminu.length){
    h += '<div class="karta"><h3>Po termínu</h3><p style="font-size:13.5px;color:var(--text2)">Seřazeno od nejstaršího.</p>'+poTerminu.slice(0,8).map(radekHTML).join('')+'</div>';
  }
  const tyden = f.filter(u => { const n=dnu(u.termin); return n!==null && n>=0 && n<=7 && (u.stav||'')!=='Hotovo'; })
                 .sort((a,b)=> (a.termin<b.termin?-1:1));
  if(tyden.length){
    h += '<div class="karta"><h3>Do sedmi dnů</h3>'+tyden.map(radekHTML).join('')+'</div>';
  }
  const ted = f.filter(u => (u.priorita||'')==='Teď' && (u.stav||'')!=='Hotovo');
  if(ted.length){ h += '<div class="karta"><h3>Priorita teď</h3>'+ted.map(radekHTML).join('')+'</div>'; }

  const podleLidi = {};
  f.forEach(u => { (u.kdo||'Bez řešitele').split(',').map(x=>x.trim()).filter(Boolean).forEach(k => { (podleLidi[k] = podleLidi[k]||[]).push(u); }); });
  const klice = Object.keys(podleLidi).sort((a,b)=> podleLidi[b].length - podleLidi[a].length).slice(0,10);
  h += '<div class="karta"><h3>Kdo kolik má</h3><p style="font-size:13.5px;color:var(--text2)">Počítá se každý, kdo je u úkolu uvedený.'+(ja?' Ty jsi '+esc(ja)+'.':'')+'</p>';
  klice.forEach(k => {
    const l = podleLidi[k], q = pocty(l);
    h += '<div class="radek" data-osoba="'+esc(k)+'"><div class="txt"><div class="nm">'+esc(k)+'</div><div class="meta"><span>'+l.length+' úkolů</span><span>hotovo '+q.hotovo+'</span><span>rozděláno '+q.proces+'</span>'+(q.po?'<span class="chip po">po termínu '+q.po+'</span>':'')+'</div>'+pasHTML(l)+'</div></div>';
  });
  h += '</div>';
  el('hlavni').innerHTML = h;
}

function vykresliSeznam(){
  const f = filtr(vsechny());
  const nazev = S.oblast ? oblastNazev(S.oblast) : 'Všechny úkoly';
  const o = S.oblast ? ZAKLAD.oblasti.find(x=>x.id===S.oblast) : null;
  let h = '<div class="nadpis"><div><h2>'+esc(nazev)+'</h2>'+(o?'<p>'+esc(o.popis)+'</p>':'')+'</div><span class="poc">'+f.length+' úkolů</span></div>';
  if(!f.length){ h += '<div class="prazdno">Nic neodpovídá filtrům.</div>'; el('hlavni').innerHTML=h; return; }
  if(S.oblast){ h += f.map(radekHTML).join(''); }
  else {
    ZAKLAD.oblasti.forEach(ob => {
      const cl = f.filter(u => u.oblast === ob.id); if(!cl.length) return;
      h += '<div class="sek"><h3>'+esc(ob.nazev)+'</h3><div class="pod">'+cl.length+' úkolů</div>'+cl.map(radekHTML).join('')+'</div>';
    });
    const bez = f.filter(u => !ZAKLAD.oblasti.some(ob => ob.id === u.oblast));
    if(bez.length) h += '<div class="sek"><h3>Nově přidané</h3>'+bez.map(radekHTML).join('')+'</div>';
  }
  el('hlavni').innerHTML = h;
}

function vykresliLide(){
  const f = filtr(vsechny());
  const mapa = {};
  f.forEach(u => {
    const k = (u.kdo||'').trim();
    if(!k){ (mapa['Bez řešitele'] = mapa['Bez řešitele']||[]).push(u); return; }
    k.split(',').map(x=>x.trim()).filter(Boolean).forEach(x => { (mapa[x] = mapa[x]||[]).push(u); });
  });
  const klice = Object.keys(mapa).sort((a,b)=>{
    if(a==='Bez řešitele') return 1; if(b==='Bez řešitele') return -1;
    return mapa[b].length - mapa[a].length;
  });
  let h = '<div class="nadpis"><div><h2>Podle lidí</h2><p>Kdo co řeší. Úkol se zobrazí u každého, kdo je u něj uvedený.</p></div><span class="poc">'+f.length+' úkolů</span></div>';
  if(!klice.length) h += '<div class="prazdno">Nic neodpovídá filtrům.</div>';
  klice.forEach(k => {
    const l = mapa[k], q = pocty(l);
    h += '<div class="sek"><h3>'+esc(k)+'</h3><div class="pod">'+l.length+' úkolů · hotovo '+q.hotovo+' · rozděláno '+q.proces+(q.po?' · po termínu '+q.po:'')+'</div>'+l.map(radekHTML).join('')+'</div>';
  });
  el('hlavni').innerHTML = h;
}

function vykresli(){
  vykresliBok();
  if(S.pohled==='prehled') vykresliPrehled();
  else if(S.pohled==='lide') vykresliLide();
  else vykresliSeznam();
  el('jenMoje').classList.toggle('on', S.moje);
  el('jenAsana').classList.toggle('on', S.asana);
  el('detaily').classList.toggle('on', S.detaily);
  el('detaily').style.display = S.pohled === 'seznam' ? '' : 'none';
}

/* ---------- šuplík ---------- */
function najdi(klic){
  if(String(klic).startsWith('n:')){ const d=String(klic).slice(2); const t=pridane[d]; return t?Object.assign({docId:d,novy:true}, t):null; }
  const id = parseInt(klic,10);
  const u = ZAKLAD.ukoly.find(x=>x.id===id);
  return u ? Object.assign({}, u, prekryv[id]||{}) : null;
}
function otevri(klic){
  const novy = klic === 'novy';
  const u = novy ? {ukol:'',popis:'',oblast:(S.oblast||ZAKLAD.oblasti[0].id),typ:'Úkol',kdo:'',termin:'',stav:'',priorita:'',zprava:'',asana:false,novy:true,docId:null} : najdi(klic);
  if(!u) return;
  otevreny = u;
  el('dwNadpis').textContent = novy ? 'Nový úkol' : u.ukol;
  const volbyLidi = ['<option value="">Nikdo zatím</option>'].concat(lide.map(j => '<option'+(u.kdo===j?' selected':'')+'>'+esc(j)+'</option>')).join('');
  const vlastni = u.kdo && !lide.includes(u.kdo);
  let h = '';
  if(!novy){
    h += '<div class="pole"><label>Co to je a proč</label><textarea id="f_popis">'+esc(u.popis||'')+'</textarea></div>';
    h += '<div class="pole"><label>Jak na to</label><textarea id="f_jak">'+esc(u.jak||'')+'</textarea></div>';
    h += '<div class="pole"><label>Čeho je to součást</label><textarea id="f_soucast">'+esc(u.soucast||'')+'</textarea></div>';
  } else {
    h += '<div class="pole"><label>Název úkolu</label><input id="f_ukol" value=""></div>';
    h += '<div class="pole"><label>Co to je</label><textarea id="f_popis"></textarea></div>';
    h += '<div class="pole"><label>Oblast</label><select id="f_oblast">'+ZAKLAD.oblasti.map(o=>'<option value="'+o.id+'"'+(o.id===u.oblast?' selected':'')+'>'+esc(o.nazev)+'</option>').join('')+'</select></div>';
  }
  h += '<div class="dvojice"><div class="pole"><label>Stav</label><select id="f_stav"><option value="">Bez stavu</option>'+STAVY.map(s=>'<option'+((u.stav||'')===s?' selected':'')+'>'+s+'</option>').join('')+'</select></div>';
  h += '<div class="pole"><label>Priorita</label><select id="f_prio"><option value="">Bez priority</option>'+PRIORITY.map(s=>'<option'+((u.priorita||'')===s?' selected':'')+'>'+s+'</option>').join('')+'</select></div></div>';
  h += '<div class="dvojice"><div class="pole"><label>Kdo to řeší</label><select id="f_kdo">'+volbyLidi+(vlastni?'<option selected>'+esc(u.kdo)+'</option>':'')+'</select></div>';
  h += '<div class="pole"><label>Do kdy</label><input id="f_termin" type="date" value="'+esc(u.termin||'')+'"></div></div>';
  h += '<div class="pole"><label>Kdo to řeší — vlastní jméno</label><input id="f_kdo2" placeholder="nech prázdné, pokud stačí výběr" value="'+(vlastni?esc(u.kdo):'')+'"></div>';
  h += '<div class="pole"><label>Poznámka k postupu</label><textarea id="f_zprava">'+esc(u.zprava||'')+'</textarea></div>';
  h += '<div class="pole"><label>Asana</label><label style="display:flex;gap:9px;align-items:center;text-transform:none;letter-spacing:0;color:var(--text2);font-size:14px"><input type="checkbox" id="f_asana" style="width:auto"'+(u.asana?' checked':'')+'> Patří do Asany jako otevřený úkol</label></div>';
  if(!novy && u.zdroj) h += '<div class="zdroj">Zdroj: '+esc(u.zdroj)+'</div>';
  if(u.zmeneno) h += '<div class="zdroj">Naposledy změnil '+esc(u.zmenil||'někdo')+' · '+esc(String(u.zmeneno).slice(0,16).replace('T',' '))+'</div>';
  el('dwTelo').innerHTML = h;
  el('suplik').classList.add('on'); el('stin').classList.add('on'); el('suplik').setAttribute('aria-hidden','false');
}
function zavri(){ el('suplik').classList.remove('on'); el('stin').classList.remove('on'); el('suplik').setAttribute('aria-hidden','true'); otevreny=null; }

async function ulozSuplik(){
  if(!otevreny) return;
  const hod = id => { const e=el(id); return e ? e.value.trim() : ''; };
  const zmena = {
    stav: hod('f_stav'), priorita: hod('f_prio'), termin: hod('f_termin'),
    kdo: hod('f_kdo2') || hod('f_kdo'), zprava: hod('f_zprava'),
    asana: !!(el('f_asana') && el('f_asana').checked)
  };
  if(!otevreny.novy){
    if(el('f_popis')) zmena.popis = el('f_popis').value.trim();
    if(el('f_jak')) zmena.jak = el('f_jak').value.trim();
    if(el('f_soucast')) zmena.soucast = el('f_soucast').value.trim();
  }
  if(otevreny.novy && !otevreny.docId){
    const nazev = hod('f_ukol');
    if(!nazev){ hlaska('Napiš název úkolu'); return; }
    if(JAKO_SOUBOR){
      const kid = 'm' + Date.now().toString(36);
      pridane[kid] = Object.assign({ ukol:nazev, popis:hod('f_popis'), oblast:parseInt(hod('f_oblast'),10), typ:'Úkol', zdroj:'Přidáno v přehledu' },
        zmena, { zmeneno:new Date().toISOString(), zmenil: mistni('ukolnik_ja')||'' });
      hlasUlozeno(); hlaska('Úkol přidán'); zavri(); vykresli(); return;
    }
    if(!db){ hlaska('Nový úkol jde přidat jen v živém odkazu'); return; }
    const ref = db.collection('nove').doc();
    const t = Object.assign({ ukol:nazev, popis:hod('f_popis'), oblast:parseInt(hod('f_oblast'),10), typ:'Úkol', zdroj:'Přidáno v přehledu' }, zmena,
      { zmeneno:new Date().toISOString(), zmenil: mistni('ukolnik_ja')||'' });
    pridane[ref.id] = t;
    try{ await ref.set(t); hlaska('Úkol přidán'); }catch(e){ hlaska('Uložení se nepovedlo'); }
    zavri(); vykresli(); return;
  }
  await zapis(otevreny, zmena);
  hlaska('Uloženo'); zavri();
}

/* ---------- události ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  const ob = t.closest('[data-ob]');
  if(ob){ S.oblast = parseInt(ob.dataset.ob,10) || null; if(S.pohled==='prehled') S.pohled='seznam'; prepniTlacitka(); vykresli(); return; }
  const cyk = t.closest('[data-cyk]');
  if(cyk){
    e.stopPropagation();
    const u = najdi(cyk.dataset.cyk); if(!u) return;
    const dalsi = STAVY[(STAVY.indexOf(u.stav||'') + 1) % (STAVY.length + 1)] || '';
    zapis(u, { stav: dalsi });
    return;
  }
  const osoba = t.closest('[data-osoba]');
  if(osoba){ S.pohled='lide'; prepniTlacitka(); vykresli(); return; }
  const radek = t.closest('.radek[data-id]');
  if(radek){ otevri(radek.dataset.id); return; }
  if(t.closest('[data-vse]')){ S.pohled='seznam'; S.stav=''; el('fStav').value=''; prepniTlacitka(); vykresli(); return; }
});
function prepniTlacitka(){ [].forEach.call(el('pohledy').children, b => b.classList.toggle('on', b.dataset.p===S.pohled)); }
el('pohledy').addEventListener('click', e => { const b=e.target.closest('button'); if(!b) return; S.pohled=b.dataset.p; prepniTlacitka(); vykresli(); });
el('q').addEventListener('input', e => { S.hledat=e.target.value; vykresli(); });
el('fStav').addEventListener('change', e => { S.stav=e.target.value; vykresli(); });
el('fPrio').addEventListener('change', e => { S.prio=e.target.value; vykresli(); });
el('fTermin').addEventListener('change', e => { S.termin=e.target.value; vykresli(); });
el('jenMoje').addEventListener('click', () => { S.moje=!S.moje; if(S.moje && !mistni('ukolnik_ja')) hlaska('Vyber nahoře, kdo jsi'); vykresli(); });
el('jenAsana').addEventListener('click', () => { S.asana=!S.asana; vykresli(); });
el('detaily').addEventListener('click', () => { S.detaily=!S.detaily; mistni('ukolnik_detaily', S.detaily?'1':'0'); vykresli(); });
el('novy').addEventListener('click', () => otevri('novy'));
el('zavrit').addEventListener('click', zavri);
el('zrusit').addEventListener('click', zavri);
el('stin').addEventListener('click', zavri);
el('ulozit').addEventListener('click', ulozSuplik);
document.addEventListener('keydown', e => { if(e.key==='Escape') zavri(); });

el('proAsanu').addEventListener('click', async () => {
  const vyber = vsechny().filter(u => u.asana);
  if(!vyber.length){ hlaska('Nic není označené do Asany'); return; }
  const radky = ['Name\tAssignee\tDue Date\tNotes'].concat(vyber.map(u =>
    [u.ukol, u.kdo||'', u.termin||'', (u.popis||'').replace(/\s+/g,' ')].join('\t')));
  const text = radky.join('\n');
  try{ await navigator.clipboard.writeText(text); hlaska(vyber.length+' úkolů zkopírováno, vlož je do Asany'); }
  catch(err){
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); hlaska(vyber.length+' úkolů zkopírováno'); }catch(e2){ hlaska('Kopírování se nepovedlo'); }
    ta.remove();
  }
});

/* ---------- start ---------- */
function naplnVolby(){
  el('fStav').innerHTML = '<option value="">Každý stav</option><option value="">—</option>' ;
  el('fStav').innerHTML = '<option value="">Každý stav</option>' + STAVY.map(s=>'<option>'+s+'</option>').join('');
  el('fPrio').innerHTML = '<option value="">Každá priorita</option>' + PRIORITY.map(s=>'<option>'+s+'</option>').join('');
  const ja = mistni('ukolnik_ja') || '';
  el('jaJsem').innerHTML = '<option value="">—</option>' + lide.map(j=>'<option'+(ja===j?' selected':'')+'>'+esc(j)+'</option>').join('');
  el('cil').textContent = (ZAKLAD.cil || '') + (ZAKLAD.verze ? ' · verze ' + ZAKLAD.verze + ' ze ' + datum(ZAKLAD.ulozeno) : '');
}
el('jaJsem').addEventListener('change', e => { mistni('ukolnik_ja', e.target.value); vykresli(); });

if(JAKO_SOUBOR) nactiMistni();
S.detaily = mistni('ukolnik_detaily') !== '0';
naplnVolby();
vykresli();
el('stavUloz').textContent = JAKO_SOUBOR ? 'soubor — změny se ukládají jen v tomhle prohlížeči' : 'připojuji sdílený přehled…';

(async () => {
  if(JAKO_SOUBOR) return;
  const u = await (window.claude && window.claude.use ? window.claude.use('user') : Promise.resolve(null));
  uzivatel = u;
  if(u){ try{ muzePsat = await u.can('data.write'); }catch(e){ muzePsat = null; } }
  const d = await (window.claude && window.claude.use ? window.claude.use('db') : Promise.resolve(null));
  if(!d){
    el('stavUloz').textContent = 'offline náhled — změny se neukládají';
    return;
  }
  db = d;
  el('stavUloz').textContent = 'sdílený přehled připojen';
  d.collection('stav').onSnapshot(s => {
    const n = {}; s.docs.forEach(doc => { n[doc.id] = doc.data() || {}; });
    prekryv = n; vykresli();
  }, e => { el('stavUloz').textContent = 'spojení vypadlo, obnov stránku'; });
  d.collection('nove').onSnapshot(s => {
    const n = {}; s.docs.forEach(doc => { n[doc.id] = doc.data() || {}; });
    pridane = n; vykresli();
  }, e => {});
  d.doc('config/lide').onSnapshot(s => {
    const v = s.exists ? s.data() : null;
    if(v && Array.isArray(v.seznam) && v.seznam.length){ lide = v.seznam.slice(); naplnVolby(); }
  }, e => {});
})();
</script>
